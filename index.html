/* ---------- storage ---------- */
const store={get(k,d){try{const v=localStorage.getItem("kv35_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem("kv35_"+k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=DATA.topics, byId=Object.fromEntries(T.map(t=>[t.id,t]));
function best(id){return store.get("best_"+id,null)}
function lecProg(id){return store.get("lec_"+id,0)}
function mins(id){const s=(TIMING[id]||[]).reduce((a,x)=>a+x.d,0);return Math.max(1,Math.round(s/60))}

/* ---------- theme ---------- */
function applyTheme(){const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;
  const dark=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  document.querySelector('meta[name=theme-color]').content=dark?"#12161D":"#F6F4EF";}
$("#themeBtn").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");store.set("theme",cur==="dark"?"light":"dark");applyTheme()};
applyTheme();

/* ---------- router ---------- */
let S={view:"home"};
function go(hash){if(location.hash!==hash)location.hash=hash;else route()}
window.addEventListener("hashchange",route);
$("#homeBtn").onclick=()=>go("#");
function route(){
  const h=location.hash.replace(/^#\/?/,"");const [a,b]=h.split("/");
  if(a==="exam"){stopAudio(true);renderExamStart();}
  else if(a&&byId[a]){openTopic(a,b==="test"?"test":"lec");}
  else{stopAudio(true);renderHome();}
  window.scrollTo(0,0);
}

/* ---------- home ---------- */
function renderHome(){
  S={view:"home"};$("#player").classList.add("hidden");
  $("#hTitle").textContent="КУРС КВ 35 діб";$("#hSub").textContent="Командир відділення · ВОС-100";
  const passed=T.filter(t=>{const b=best(t.id);return b&&b.pct>=80}).length;
  const pts=T.reduce((a,t)=>a+((best(t.id)||{}).s||0),0), maxPts=T.reduce((a,t)=>a+t.test.length,0);
  const last=store.get("last",null);
  const mods=[];T.forEach(t=>{let m=mods.find(x=>x.n===t.mod);if(!m){m={n:t.mod,items:[]};mods.push(m)}m.items.push(t)});
  let html=`<div class="wrap">
  <section class="hero">
    <div class="eyebrow">Програма підготовки командирів відділень</div>
    <h1>КУРС КВ<br>35 діб</h1>
    <p>Слухайте лекцію — текст іде паралельно. Потім закріпіть ключові сенси тестом. Тема засвоєна, коли тест складено на 80% і більше.</p>
    <div class="stats">
      <div class="stat"><b>${passed}/${T.length}</b><span>тем засвоєно</span></div>
      <div class="stat"><b>${pts}</b><span>балів з ${maxPts}</span></div>
      <div class="stat"><b>${(store.get("exam",null)||{}).pct??"—"}${store.get("exam",null)?"%":""}</b><span>підсумковий іспит</span></div>
    </div>
    <div class="cta">${last&&byId[last]?`<button class="btn p" data-go="#${last}">${icon("play")} Продовжити: ${esc(byId[last].short)}</button>`:`<button class="btn p" data-go="#${T[0].id}">${icon("play")} Почати з першої теми</button>`}</div>
  </section>`;
  let n=0;
  mods.forEach(m=>{
    html+=`<div class="mod"><h2>${esc(m.n)}</h2></div><div class="list">`;
    m.items.forEach(t=>{n++;const b=best(t.id);const done=b&&b.pct>=80;
      const badge=b?`<span class="badge ${b.pct>=80?"good":"low"}">${b.s}/${b.n}</span>`:`<span class="badge">${t.test.length} пит.</span>`;
      html+=`<button class="row ${done?"done":""}" data-go="#${t.id}"><span class="num">${done?"✓":n}</span><span class="t"><b>${esc(t.title)}</b><span>${mins(t.id)} хв аудіо · ${t.sections.length} розділів${lecProg(t.id)>0?` · прослухано ${Math.round(lecProg(t.id)/t.sections.length*100)}%`:""}</span></span>${badge}</button>`;
    });
    html+=`</div>`;
  });
  html+=`<div class="exam"><div><b>Підсумковий іспит</b><span>40 випадкових питань з усіх ${T.length} тем. Без підказок до кінця — як на контрольному занятті.</span></div><button class="btn" data-go="#exam">Скласти іспит</button></div>
  <footer class="foot"><span>${DEV}</span><span>За Програмою об’єднаної (суміщеної) підготовки командирів відділень за ВОС-100, 2026</span></footer></div>`;
  $("#view").innerHTML=html;bindGo();
}
function bindGo(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}
function icon(n){return {play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',

  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>'}[n]}

/* ---------- topic ---------- */
function openTopic(id,tab){
  const t=byId[id];
  if(S.view!=="topic"||S.id!==id){stopAudio(true);S={view:"topic",id,tab};store.set("last",id);}
  S.tab=tab;
  $("#hTitle").textContent=t.short;$("#hSub").textContent=t.mod;
  const idx=T.indexOf(t)+1;
  let html=`<div class="wrap"><div class="thead"><span class="eyebrow">Тема ${idx} з ${T.length}</span><h1>${esc(t.title)}</h1><p>Програма: ${esc(t.src)}</p></div>
  <div class="tabs" role="tablist"><button class="tab ${tab==="lec"?"on":""}" data-go="#${id}">Лекція · ${mins(id)} хв</button><button class="tab ${tab==="test"?"on":""}" data-go="#${id}/test">Тест · ${t.test.length} питань</button></div>`;
  if(tab==="lec"){
    html+=`<article class="lec">`;
    t.sections.forEach((sec,si)=>{
      html+=`<section class="sec"><h2 class="blk" id="s${si}h" data-s="${si}">${esc(sec.h)}</h2>`;
      sec.body.forEach(([k,v],bi)=>{
        const id_=`s${si}b${bi}`;
        if(k==="p")html+=`<p class="blk" id="${id_}" data-s="${si}">${v}</p>`;
        else if(k==="ul")html+=`<ul>${v.map((it,li)=>`<li class="blk" id="${id_}i${li}" data-s="${si}">${it}</li>`).join("")}</ul>`;
        else html+=`<div class="callout blk ${k==="warn"?"warn":""}" id="${id_}" data-s="${si}"><small>${k==="warn"?"Важливо":"Ключова думка"}</small>${v}</div>`;
      });
      html+=`</section>`;
    });
    html+=`<section class="keys"><h2>Ключові сенси теми</h2><ol>${t.keys.map(k=>`<li>${esc(k)}</li>`).join("")}</ol><button class="btn p" data-go="#${id}/test">${icon("test")} Закріпити: тест на ${t.test.length} питань</button></section></article></div>`;
    $("#view").innerHTML=html;bindGo();
    document.querySelectorAll(".blk").forEach(el=>el.onclick=()=>seekBlock(el.id));
    setupPlayer(t);
  }else{
    $("#player").classList.add("hidden");pauseAudio();
    html+=`<div id="quiz" class="quiz"></div></div>`;
    $("#view").innerHTML=html;bindGo();
    startQuiz({title:t.title,items:t.test.map((q,i)=>({q,tid:id,i})),save:id});
  }
}

/* ---------- audio ---------- */
const audio=new Audio();audio.preload="auto";
const RATES=[1,1.25,1.5,0.9];
let A={t:null,s:0,rate:store.get("rate",1),cur:null,userScroll:0};
audio.playbackRate=A.rate;
function setupPlayer(t){
  A.t=t;$("#player").classList.remove("hidden");$("#pSpd").textContent=fmtRate(A.rate);
  if(A.cur&&A.tid===t.id){paintNow(A.cur);updateUI();return}
  A.tid=t.id;A.s=Math.min(store.get("pos_"+t.id,0),t.sections.length-1);loadSec(A.s,false);
}
function fmtRate(r){return (r+"").replace(".",",")+"×"}
function loadSec(s,play,at){
  const tm=TIMING[A.t.id];if(!tm||!tm[s])return;
  A.s=s;audio.src="audio/"+tm[s].f;audio.playbackRate=A.rate;
  const go=()=>{if(at)audio.currentTime=at;if(play)audio.play().catch(()=>{});};
  if(audio.readyState>=1)go();else audio.addEventListener("loadedmetadata",go,{once:true});
  store.set("pos_"+A.t.id,s);updateUI();mediaMeta();
}
function updateUI(){
  if(!A.t)return;const sec=A.t.sections[A.s];
  $("#pTitle").textContent=sec?sec.h:"";
  const d=audio.duration||(TIMING[A.t.id][A.s]||{}).d||0;
  $("#pTime").textContent=`${A.s+1}/${A.t.sections.length} · ${fmt(audio.currentTime)} / ${fmt(d)}`;
  $("#pFill").style.width=(d?audio.currentTime/d*100:0)+"%";
  const playing=!audio.paused;$("#icPlay").classList.toggle("hidden",playing);$("#icPause").classList.toggle("hidden",!playing);
  $("#pPlay").setAttribute("aria-label",playing?"Пауза":"Слухати");
}
function fmt(x){x=Math.floor(x||0);return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
audio.addEventListener("timeupdate",()=>{
  if(!A.t||S.view!=="topic")return;updateUI();
  const m=(TIMING[A.t.id][A.s]||{}).m||[];let cur=m[0]&&m[0][0];
  for(const [id,t] of m){if(audio.currentTime+0.05>=t)cur=id;else break}
  if(cur&&cur!==A.cur){A.cur=cur;if(S.tab==="lec")paintNow(cur,true)}
});
audio.addEventListener("play",updateUI);audio.addEventListener("pause",updateUI);
audio.addEventListener("ended",()=>{
  const lp=Math.max(lecProg(A.t.id),A.s+1);store.set("lec_"+A.t.id,lp);
  if(A.s+1<A.t.sections.length)loadSec(A.s+1,true);
  else{store.set("pos_"+A.t.id,0);updateUI();const k=document.querySelector(".keys");if(k&&S.tab==="lec")k.scrollIntoView({behavior:"smooth",block:"center"});}
});
function paintNow(id,scroll){
  document.querySelectorAll(".blk.now").forEach(e=>e.classList.remove("now"));
  const el=document.getElementById(id);if(!el)return;el.classList.add("now");
  if(scroll&&Date.now()-A.userScroll>5000){const r=el.getBoundingClientRect();const vh=innerHeight;if(r.top<90||r.bottom>vh-150)el.scrollIntoView({behavior:"smooth",block:"center"})}
}
["wheel","touchmove"].forEach(ev=>addEventListener(ev,()=>{A.userScroll=Date.now()},{passive:true}));
function seekBlock(id){
  const s=+document.getElementById(id).dataset.s;const m=(TIMING[A.t.id][s]||{}).m||[];
  const mk=m.find(x=>x[0]===id);const at=mk?mk[1]:0;
  A.userScroll=0;A.cur=null;
  if(s!==A.s)loadSec(s,true,at);else{audio.currentTime=at;audio.play().catch(()=>{})}
}
function togglePlay(){if(!A.t)return;if(audio.paused){audio.play().catch(()=>{});A.userScroll=0}else audio.pause()}
function pauseAudio(){try{audio.pause()}catch(e){}}
function stopAudio(reset){pauseAudio();if(reset){A.cur=null}}
$("#pPlay").onclick=togglePlay;
$("#pPrev").onclick=()=>{if(audio.currentTime>4)audio.currentTime=0;else if(A.s>0)loadSec(A.s-1,!audio.paused)};
$("#pNext").onclick=()=>{if(A.s+1<A.t.sections.length)loadSec(A.s+1,!audio.paused)};
$("#pSpd").onclick=()=>{A.rate=RATES[(RATES.indexOf(A.rate)+1)%RATES.length];audio.playbackRate=A.rate;store.set("rate",A.rate);$("#pSpd").textContent=fmtRate(A.rate)};
$("#pBar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(audio.duration)audio.currentTime=(e.clientX-r.left)/r.width*audio.duration};
function mediaMeta(){if(!("mediaSession" in navigator)||!A.t)return;try{
  navigator.mediaSession.metadata=new MediaMetadata({title:A.t.sections[A.s].h,artist:A.t.short,album:"КУРС КВ 35 діб"});
  navigator.mediaSession.setActionHandler("play",()=>audio.play());navigator.mediaSession.setActionHandler("pause",()=>audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack",()=>$("#pNext").onclick());navigator.mediaSession.setActionHandler("previoustrack",()=>$("#pPrev").onclick());
}catch(e){}}

/* ---------- quiz ---------- */
let Q=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(cfg){
  Q={...cfg,items:shuffle(cfg.items).map(it=>{const [q,opts,ex]=it.q;return {...it,text:q,ex,opts:shuffle(opts.map((o,k)=>({o,ok:k===0})))}}),i:0,score:0,picked:null,wrong:[]};
  renderQ();
}
function renderQ(){
  const box=$("#quiz");const it=Q.items[Q.i];const n=Q.items.length;
  const L="АБВГ";
  let h=`<div class="qhead"><span>Питання ${Q.i+1} з ${n}</span><span>${Q.score} ${balWord(Q.score)}</span></div><div class="qprog"><i style="width:${Q.i/n*100}%"></i></div>`;
  if(Q.exam)h+=`<div class="eyebrow" style="margin-bottom:6px">${esc(byId[it.tid].short)}</div>`;
  h+=`<div class="qtext">${esc(it.text)}</div><div class="opts">`;
  it.opts.forEach((o,k)=>{let c="";if(Q.picked!==null){if(Q.exam)c=k===Q.picked?"sel":"dim";else if(o.ok)c="right";else if(k===Q.picked)c="wrong";else c="dim"}
    h+=`<button class="opt ${c}" data-k="${k}" ${Q.picked!==null?"disabled":""}><span class="k">${L[k]}</span><span>${esc(o.o)}</span></button>`});
  h+=`</div>`;
  if(Q.picked!==null){
    const ok=it.opts[Q.picked].ok;
    if(!Q.exam)h+=`<div class="verdict ${ok?"ok":"no"}"><b>${ok?"Правильно. +1 бал":"Неправильно"}</b>${ok?"":`Правильна відповідь: ${esc(it.opts.find(o=>o.ok).o)}. `}${esc(it.ex)}</div>`;
    if(!Q.exam)h+=`<div class="qnext"><button class="btn p" id="qNext">${Q.i+1<n?"Далі":"Результат"} →</button></div>`;
  }
  box.innerHTML=h;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  const nx=$("#qNext");if(nx){nx.onclick=nextQ;nx.focus({preventScroll:true})}
}
function balWord(n){const a=n%10,b=n%100;if(a===1&&b!==11)return"бал";if(a>=2&&a<=4&&(b<12||b>14))return"бали";return"балів"}
function pick(k){if(Q.picked!==null)return;Q.picked=k;const it=Q.items[Q.i];if(it.opts[k].ok)Q.score++;else Q.wrong.push(it);renderQ();
  if(Q.exam){setTimeout(()=>{if(Q&&Q.picked===k&&Q.items[Q.i]===it)nextQ()},650)}}
function nextQ(){Q.picked=null;Q.i++;if(Q.i>=Q.items.length)renderResult();else{renderQ();const qt=document.querySelector(".quiz");if(qt&&qt.getBoundingClientRect().top<0)qt.scrollIntoView()}}
function gradeOf(p){return p>=90?"Відмінно":p>=75?"Добре":p>=60?"Задовільно":"Незадовільно"}
function renderResult(){
  const n=Q.items.length,s=Q.score,p=Math.round(s/n*100);
  if(Q.save){const b=best(Q.save);if(!b||s/n>b.s/b.n)store.set("best_"+Q.save,{s,n,pct:p});}
  if(Q.exam){const prev=store.get("exam",null);if(!prev||p>prev.pct)store.set("exam",{pct:p,s,n})}
  const C=2*Math.PI*74,col=p>=80?"var(--acc)":p>=60?"var(--amb)":"var(--bad)";
  let h=`<div class="res"><div class="ring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="74" fill="none" stroke="var(--soft)" stroke-width="14"/><circle cx="85" cy="85" r="74" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-s/n)}"/></svg><div class="v"><b>${s}/${n}</b><span>${p}% · ${s} ${balWord(s)}</span></div></div>
  <div class="grade">${gradeOf(p)}</div><p>${p>=80?(Q.exam?"Курс засвоєно впевнено.":"Тему засвоєно. Можна переходити до наступної."):"Для засвоєння потрібно 80%. Перегляньте помилки й спробуйте ще раз."}</p>
  <div class="cta">`;
  if(Q.wrong.length)h+=`<button class="btn p" id="rWrong">Повторити помилки (${Q.wrong.length})</button>`;
  h+=`<button class="btn" id="rAgain">Пройти ще раз</button>`;
  if(Q.save){const nx=T[T.indexOf(byId[Q.save])+1];if(nx&&p>=80)h+=`<button class="btn p" data-go="#${nx.id}">Наступна тема →</button>`;else if(p<80)h+=`<button class="btn" data-go="#${Q.save}">Перечитати лекцію</button>`}
  else h+=`<button class="btn" data-go="#">До тем</button>`;
  h+=`</div>`;
  if(Q.exam){const agg={};Q.items.forEach(it=>{const a=agg[it.tid]||(agg[it.tid]={n:0,w:0});a.n++});Q.wrong.forEach(it=>agg[it.tid].w++);
    h+=`<div class="bytopic"><h3 style="font-size:18px;margin-bottom:6px">За темами</h3>${Object.entries(agg).sort((a,b)=>b[1].w/b[1].n-a[1].w/a[1].n).map(([id,a])=>`<div class="bt"><span>${esc(byId[id].short)}</span><span style="color:${a.w?"var(--bad)":"var(--ok)"}">${a.n-a.w}/${a.n}</span></div>`).join("")}</div>`}
  if(Q.wrong.length){h+=`<div class="mist"><h3>Розбір помилок</h3>${Q.wrong.map(it=>`<div class="mi">${Q.exam?`<div class="tp">${esc(byId[it.tid].short)}</div>`:""}<b>${esc(it.text)}</b><div class="ans">✓ ${esc(it.opts.find(o=>o.ok).o)}</div><div class="ex">${esc(it.ex)}</div></div>`).join("")}</div>`}
  h+=`</div>`;
  $("#quiz").innerHTML=h;bindGo();window.scrollTo({top:0,behavior:"smooth"});
  const cfg={title:Q.title,save:Q.save,exam:Q.exam};const wrong=Q.wrong.map(it=>({q:it.q,tid:it.tid,i:it.i}));const all=Q.all||Q.items.map(it=>({q:it.q,tid:it.tid,i:it.i}));
  const rw=$("#rWrong");if(rw)rw.onclick=()=>startQuiz({...cfg,save:null,items:wrong,exam:false});
  $("#rAgain").onclick=()=>Q.exam?renderExamStart(true):startQuiz({...cfg,items:all});
}

/* ---------- exam ---------- */
function renderExamStart(direct){
  S={view:"exam"};$("#player").classList.add("hidden");
  $("#hTitle").textContent="Підсумковий іспит";$("#hSub").textContent="40 питань з усіх тем";
  const pool=[];T.forEach(t=>t.test.forEach((q,i)=>pool.push({q,tid:t.id,i})));
  // рівномірно: по 2 з кожної теми + решта випадково
  let pickd=[];T.forEach(t=>{pickd.push(...shuffle(pool.filter(p=>p.tid===t.id)).slice(0,2))});
  const rest=shuffle(pool.filter(p=>!pickd.includes(p)));pickd=pickd.concat(rest.slice(0,Math.max(0,40-pickd.length)));
  if(!direct){
    $("#view").innerHTML=`<div class="wrap"><div class="thead"><span class="eyebrow">Контрольне заняття</span><h1>Підсумковий іспит</h1><p>40 випадкових питань з усіх ${T.length} тем — щонайменше по два з кожної. Підказки й пояснення — після завершення. Оцінка: 90% — відмінно, 75% — добре, 60% — задовільно.</p></div>
    <div class="cta" style="margin-top:22px"><button class="btn p" id="exGo">${icon("test")} Почати іспит</button><button class="btn" data-go="#">До тем</button></div></div>`;
    bindGo();$("#exGo").onclick=()=>renderExamStart(true);return;
  }
  $("#view").innerHTML=`<div class="wrap"><div class="thead"><span class="eyebrow">Підсумковий іспит</span><h1>40 питань</h1></div><div id="quiz" class="quiz"></div></div>`;
  startQuiz({title:"Іспит",items:pickd,save:null,exam:true});Q.all=pickd;
}

/* ---------- keys ---------- */
addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea"))return;
  if(S.view==="topic"&&S.tab==="lec"){
    if(e.code==="Space"){e.preventDefault();togglePlay()}
    else if(e.key==="ArrowRight"&&!e.altKey){$("#pNext").onclick()}
    else if(e.key==="ArrowLeft"&&!e.altKey){$("#pPrev").onclick()}
  }
  if(Q&&$("#quiz")){
    const k="1234".indexOf(e.key);const k2="абвгАБВГ".indexOf(e.key)%4;
    if(Q.picked===null&&(k>=0||k2>=0)){e.preventDefault();pick(k>=0?k:k2)}
    else if(Q.picked!==null&&e.key==="Enter"&&document.activeElement.id!=="qNext"){e.preventDefault();nextQ()}
  }
  if(e.key==="Escape")go("#");
});
route();
</script>
