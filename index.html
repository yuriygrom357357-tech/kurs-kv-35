нету", "Вимкнення шифрування"], "Курсанти отримують рекомендації щодо паролів і ПЗ, через яке ворог може отримати дані."], ["Який принцип демонструють відео на занятті «Особистий приклад командира»?", ["«Роби як я»", "«Роби як скажу»", "«Кожен сам за себе»", "«Наказ не обговорюється»"], "Керівник демонструє короткі відео, де чітко висвітлено принцип «роби як я»."], ["Що означає щільність (насиченість) заняття?", ["Раціональне використання часу з постійним навантаженням на курсантів", "Кількість курсантів у класі відносно кількості інструкторів", "Обсяг конспекту, який курсанти мають записати за заняття", "Кількість перерв, потрібних для відпочинку курсантів"], "Щільність — раціональне використання всього навчального часу для постійного навантаження."], ["Як побудовані методичні заняття з відео?", ["Спершу заняття з помилками інструктора, потім — без помилок, і їх порівняння", "Курсанти дивляться лише зразкове заняття і переказують його", "Інструктор показує відео без обговорення, курсанти конспектують", "Відео не використовують — лише розповідь з власного досвіду"], "Курсанти шукають помилки в слабкому занятті, а потім порівнюють його з якісним."], ["Що таке тренування згідно з термінами Програми?", ["Осмислене багаторазове повторення вже вивчених вправ для їх закріплення", "Перше ознайомлення з новою дією під керівництвом інструктора", "Перевірка рівня знань курсантів наприкінці навчального тижня", "Показ дії інструктором без участі тих, хто навчається"], "Тренування — повторення вивченого для закріплення і вдосконалення."], ["Що таке пошуковий (евристичний) метод навчання?", ["Самостійний пошук інформації чи оптимального варіанту дій за напрямом, визначеним керівником", "Виконання дій строго за алгоритмом, який визначив керівник", "Виконання дій строго за алгоритмом, визначеним керівником, з багаторазовим повторенням до автоматизму", "Механічне заучування визначень і нормативів напам’ять"], "Евристичний метод — самостійний пошук за напрямом, який визначив керівник."], ["Що з наведеного входить до алгоритму підготовки керівника до заняття?", ["Рекогносцировка району і розробка плану проведення заняття", "Перенесення заняття на інший день для кращої підготовки", "Скорочення плану заняття до одного навчального питання", "Призначення курсанта, який проведе заняття замість керівника"], "Алгоритм: особиста підготовка, вихідні дані, вибір і рекогносцировка району, план, підготовка людей і МТЗ."], ["Який бойовий статут детально розглядається на занятті з організаційної підготовки?", ["Бойовий статут механізованих і танкових військ СВ (взвод, відділення, екіпаж)", "Бойовий статут Повітряних Сил (частина про ланку і екіпаж)", "Бойовий статут ВМС (частина про бойовий корабель)", "Бойовий статут Повітряних Сил ЗС України (частина про ланку, екіпаж і наземне забезпечення польотів)"], "Розглядається структура і зміст БС механізованих і танкових військ — частина ІІІ (взвод, відділення, екіпаж)."], ["Що таке норматив?", ["Часовий, кількісний і якісний показник виконання завдань, прийомів і дій", "Розпорядок дня навчального підрозділу з часом занять", "Розпорядок дня навчального підрозділу з точним часом початку і кінця кожного заняття", "Протокол засідання кваліфікаційної комісії"], "Норматив — показник виконання окремими військовослужбовцями або підрозділами завдань і прийомів."], ["Коли тактична підготовка досягає успіху за Програмою?", ["Коли обстановка максимально наближена до сучасного бою і викликає високу напруженість", "Коли заняття проходять у класі без зайвого навантаження, щоб курсанти встигали все занотувати", "Коли на занятті немає імітації противника і стрес-факторів", "Коли тактичні питання відпрацьовують окремо одне від одного"], "Наближення до сучасного бою — з БпЛА і демонстраційними групами — дає високу фізичну й психічну напругу."]]}, {"id": "t08", "mod": "Модуль II – Вдосконалення", "src": "Тема 4.2.1, додатки 8 і 9", "title": "Психологічна підготовка", "short": "Психологічна підготовка", "sections": [{"h": "Командир — психолог і «громовідвід»", "body": [["key", "Командир — це психолог, наставник і «громовідвід» для свого підрозділу."], ["p", "Форми занять: бесіда, обговорення, дискусія, перегляд аудіовізуальної інформації, тренінг. Методи: пояснення, демонстрація, імітація (тренування), практика. Керівники — сержанти-інструктори та офіцери психологічної підтримки персоналу. Практичні заняття проводять «у колі довіри», на тактичному полі, в окопі, бліндажі."]]}, {"h": "Тема 1. Вплив бою на психіку", "body": [["p", "Будова і робота центральної нервової системи, закономірності поведінки в екстремальних умовах. Феномени, які треба вміти розпізнати:"], ["ul", ["<b>бойовий стрес</b> і стрес-чинники сучасного бою;", "<b>гостра реакція на стрес</b>;", "<b>бойова психічна травма</b>;", "<b>емоційне вигорання</b>;", "<b>бойова втома</b>."]], ["p", "Демонстрація — через екран і VR-окуляри. На другому занятті курсанти тренуються розпізнавати негативні психічні реакції за картками надання першої психологічної допомоги та застосовують прийоми саморегуляції."]]}, {"h": "Тема 2. Страх і перша психологічна допомога", "body": [["p", "Сутність виникнення страху, його види, причини і вплив на організм. Методи першої психологічної допомоги тим, хто відчуває страх, способи контролю і попередження страху в бою. Практика — вправи з подолання страху, техніки само- та взаємодопомоги."]]}, {"h": "Тема 3. Конфлікти", "body": [["p", "Структура, прояви і типологія конфліктів, психологічні причини та вплив на особистість, внутрішньоособистісні та міжособистісні конфлікти."], ["p", "Практика: методи запобігання і вирішення конфліктів, управління власними емоціями і <b>вміння пробачати</b>."]]}, {"h": "Тема 4. Мотивування", "body": [["p", "Форми впливу на свідомість підлеглих:"], ["ul", ["мотивація через <b>«Промову Переможця»</b>;", "мотивація через команду;", "мотиваційний діалог;", "подолання негативних переконань."]], ["p", "Командир доводить призначення підрозділу, місце кожного, загальну і особисту мету, завдання і відповідальність за наслідки. Під час тренінгу одна підгрупа навчається, а інша імітує безпорадність і зневіру."], ["p", "<b>Профілактика СЗЧ</b>: виявлення ризиків на ранній стадії через бесіди і спостереження; довірчий контакт за принципами <b>«тримання рамки»</b>, спокійного стилю і <b>«підсиленого слухання»</b>; мотиваційне інтерв’ю; робота з почуттям несправедливості, конфліктами і родинними чинниками."], ["p", "<b>Відмова виконувати бойове завдання</b>: стабілізація ситуації, кризова бесіда, аналіз для виявлення причин відмови і відповідне рішення; методи емоційної стабілізації, командирське інформування."]]}, {"h": "Психологічне налаштування перед завданням", "body": [["p", "Алгоритм з додатка 8. Керівник чітко повідомляє роль підрозділу і місце кожного, мету і завдання, заради чого вести бій, пропонує кожному взяти відповідальність. Курсанти повторюють і називають, заради кого будуть воювати."], ["ul", ["<b>Мобілізація</b>: 10–15 присідань, поплескування по щоках, плечах, спині, натискання активних точок, мобілізуюче форсоване дихання, крик, рух.", "<b>Заспокоєння</b>: знайти 5 предметів певного кольору, самомасаж, рухи очима (релаксація Пірса), діафрагмальне дихання — вдих на 2, видих на 4, пауза на 2, 8–10 циклів.", "<b>Якір упевненості</b>: кричалки до 6 слів і жести — «Наша — ВОЛЯ, Разом — СИЛА», слова командира «Я в вас ВІРЮ!»."]]]}, {"h": "Страх смерті: алгоритм командира", "body": [["p", "Додаток 9. Основа — <b>особистий приклад</b>: заходи неавторитетного командира не дають результату. Командир умовно ділить підлеглих на три групи:"], ["ul", ["<b>група 1</b> — зберігають самовладання і підтримують інших;", "<b>група 2</b> — тримаються самі, але підтримати інших не здатні;", "<b>група 3</b> — втрачають самовладання і самотужки не справляються."]], ["p", "Бійців групи 1 закріплюють за бійцями групи 3 — своєрідне шефство, у бою по можливості поруч. Це посилює обох. Повністю нездатних до самоконтролю, які деморалізують інших — так звані психогенні втрати, — виводять з передової."], ["p", "Чіткий план дій знімає страх невідомості. Корисно подумки «прокрутити» свої дії в різних варіантах розвитку подій."], ["p", "Після бою — <b>дебрифінг критичного інциденту</b>: кожен виговорюється, шукаємо, що було зроблено правильно, навіть за поганого результату; кожен називає 1–2 конкретні проблеми, над якими треба працювати. І шукаємо смисли — хоча б те, що ви живі і потрібні."]]}], "keys": ["Командир — психолог, наставник і «громовідвід».", "Розрізняти: гостра реакція на стрес, бойова психічна травма, вигорання, бойова втома.", "Чіткий план дій знімає страх невідомості.", "Групи 1–2–3: сильних закріплюють за тими, хто втрачає самовладання.", "Після бою — дебрифінг: що зроблено правильно і 1–2 проблеми для роботи."], "test": [["Як Програма визначає роль командира в психологічній підготовці?", ["Психолог, наставник і «громовідвід» для підрозділу", "Контролер дисципліни, який не втручається в психологію", "Особа, що передає всі питання психологу частини", "Представник штабу з питань звітності про втрати"], "Програма наголошує: командир — психолог, наставник і «громовідвід»."], ["Які стани курсанти вчаться ідентифікувати на темі 1?", ["Гостру реакцію на стрес, бойову психічну травму, емоційне вигорання і бойову втому", "Лише фізичну втому і недосипання після маршу", "Фізичну перевтому, зневоднення, переохолодження і тепловий удар після тривалих маршів", "Тільки радість і сум як базові емоції"], "Це чотири ключові стани, які командир має вміти розпізнати за ознаками."], ["Що використовують для тренування розпізнавання негативних психічних реакцій?", ["Картки надання першої психологічної допомоги", "Мішені № 6 з тепловими джерелами і VR-окуляри", "Топографічні карти й компас", "Анкети медичного огляду"], "Тренування з розпізнавання проводиться з використанням карток надання першої психологічної допомоги."], ["Що з наведеного є формою мотиваційного впливу на підлеглих за Програмою?", ["«Промова Переможця»", "Публічне приниження", "Позбавлення їжі", "Ігнорування бійця"], "Форми: «Промова Переможця», мотивація через команду, мотиваційний діалог, подолання негативних переконань."], ["Які принципи побудови довірчого контакту застосовують при профілактиці СЗЧ?", ["«Тримання рамки», спокійний стиль комунікації, «підсилене слухання»", "Жорсткий тиск, погрози і публічне засудження", "Повна відсутність спілкування до прийняття рішення", "Жорсткий тиск, публічне засудження перед строєм і погрози покаранням"], "Ці принципи допомагають побудувати довіру і безпеку в розмові."], ["Що робить командир у разі відмови підлеглого виконувати бойове завдання?", ["Стабілізує ситуацію, проводить кризову бесіду і аналіз для виявлення причин", "Негайно застосовує фізичну силу для примусу", "Ігнорує відмову і призначає іншого бійця без розмови", "Негайно передає справу до військової прокуратури, а бійця відсторонює без жодної розмови"], "Типовий порядок — стабілізація, кризова бесіда, аналіз причин і відповідне рішення."], ["На які три групи командир умовно ділить підлеглих щодо страху смерті?", ["Тримаються і підтримують інших; тримаються самі; втрачають самовладання", "Старші, середні й молодші за віком та досвідом", "Кулеметники, стрільці й гранатометники відділення", "За віком і стажем: молодші, середні та старші, з досвідом і без бойового досвіду"], "Поділ — за здатністю зберігати самовладання і підтримувати інших."], ["Що робить командир з бійцями групи 1 і групи 3?", ["Закріплює бійців групи 1 за бійцями групи 3 для постійної підтримки", "Розводить їх у різні підрозділи, щоб не заважали", "Ставить групу 3 в авангард для загартування", "Розводить їх у різні підрозділи, щоб слабкі бійці не деморалізували сильних"], "Своєрідне шефство посилює самовладання і групи 3, і групи 1."], ["Що знімає страх невідомості у підлеглих?", ["Чіткий план дій у кожного", "Відсутність зайвої інформації", "Постійні зміни завдання", "Суворі покарання за страх"], "Чіткий план знімає невизначеність, зменшує страх невдачі і збільшує впевненість."], ["Яке дихання рекомендовано для заспокоєння в алгоритмі психологічного налаштування?", ["Діафрагмальне: вдих на 2 рахунки, видих на 4, пауза на 2, 8–10 циклів", "Затримка дихання до 2 хвилин, потім різкий видих", "Часте поверхневе дихання протягом 5 хвилин", "Часте поверхневе дихання: вдих і видих по 1 рахунку протягом 5 хвилин безперервно"], "Глибоке діафрагмальне дихання з подовженим видихом заспокоює."], ["Що є основною умовою ефективності заходів командира щодо страху смерті?", ["Особистий приклад і авторитет командира", "Кількість наказів і суворість покарань", "Гучний голос і військове звання командира", "Тривалі лекції про небезпеку на війні"], "Будь-які заходи неавторитетного командира не матимуть очікуваного результату."], ["Що з’ясовують під час дебрифінгу, навіть якщо результат завдання негативний?", ["Що було зроблено правильно, і 1–2 конкретні проблеми для роботи", "Хто винен у невдачі і яке покарання призначити", "Скільки ресурсів витрачено і хто за це відповість", "Нічого — після невдалого завдання дебрифінг не роблять"], "Пошук позитивних моментів підвищує самооцінку, а 1–2 проблеми дають конкретний фокус."], ["Що таке «психогенні втрати»?", ["Бійці, які повністю втратили самоконтроль і деморалізують інших", "Бійці, поранені в голову під час обстрілу", "Бійці, що перебувають у відпустці або на лікуванні", "Бійці, які отримали поранення в голову під час артилерійського обстрілу"], "Таких бійців командир відокремлює і вживає заходів щодо виведення з передової."], ["Чого навчають на занятті «Управління конфліктами»?", ["Запобігати і вирішувати конфлікти, керувати емоціями і вміти пробачати", "Перемагати у суперечках, відстоювати свою думку і складати скарги на конфліктних бійців", "Уникати будь-якого спілкування з конфліктними бійцями", "Складати скарги на конфліктних військовослужбовців"], "Практика — методи запобігання й вирішення конфліктів, управління емоціями та вміння пробачати."], ["Скільки слів рекомендовано в «кричалці» для якоря впевненості?", ["До 6 слів", "Не менше 20 слів", "Одне слово", "Ціла пісня"], "Кричалки до 6 слів із жестами стають якорем впевненості і віри у власні сили."]]}, {"id": "t09", "mod": "Модуль II – Вдосконалення", "src": "Тема 4.2.2", "title": "Інноваційні технології: Delta, застосунки, НРК, БпЛА, РЕБ", "short": "Інноваційні технології", "sections": [{"h": "Технологічна перевага", "body": [["key", "Дрон — це «очі» відділення. РЕБ — це реальність."], ["p", "Предмет «Інноваційні технології» має п’ять тем: онлайн-платформа «Delta», навчальні застосунки, наземні роботизовані комплекси (НРК), БпЛА коптерного типу і системи радіоелектронної боротьби (РЕБ)."]]}, {"h": "Платформа «Delta»", "body": [["p", "Курсантам наочно доводять структуру і можливості онлайн-платформи «Delta» та порядок реєстрації. Під наставництвом керівника кожен <b>реєструється в системі «Delta»</b> і обліковується в «кімнаті» навчального взводу."]]}, {"h": "Навчальні застосунки", "body": [["p", "Платформи навчання: <b>«Prometheus»</b>, <b>«Combat 4»</b> і <b>«Армія+»</b> — їх можливості, порядок використання і реєстрації. На самопідготовці курсанти встановлюють застосунки і знайомляться з інтерфейсом."], ["p", "Завдання: пройти в «Армія+» курси <b>«Delta»</b> і <b>«Побут в польових умовах»</b> — у вільний час і на самопідготовці."]]}, {"h": "НРК — наземні роботизовані комплекси", "body": [["p", "Теорія: основи управління, тактика військового застосування і види НРК — зі слайдами і відео."], ["p", "Практика: показ порядку управління, заходи безпеки, тренування кожного курсанта — <b>2–3 хвилини на військовослужбовця</b>."]]}, {"h": "БпЛА коптерного типу", "body": [["p", "Основи управління і тактика застосування БпЛА коптерного типу, а на практиці — керування дроном під наглядом інструктора, також по 2–3 хвилини на людину, з дотриманням заходів безпеки."], ["p", "На курсі БпЛА використовуються й для навчання: польові заняття знімають з дронів, у вправах з управління вогнем екіпаж БпЛА веде аеророзвідку, цілевказання і коригування вогню."]]}, {"h": "Системи РЕБ", "body": [["p", "Теорія: основи управління, тактика застосування і види систем РЕБ."], ["p", "Практика: демонстрація роботи систем РЕБ і їх впливу на <b>БпЛА коптерного типу, FPV-дрони і НРК</b>, тренування кожного курсанта по 2–3 хвилини."], ["p", "Висновок для командира відділення: противник теж застосовує РЕБ і розвідку, тому зв’язок, дрони і телефони мають працювати з урахуванням радіоелектронної загрози."]]}], "keys": ["Дрон — «очі» відділення; РЕБ — реальність.", "Кожен курсант реєструється в «Delta».", "«Prometheus», «Combat 4», «Армія+»; у «Армія+» — курси «Delta» і «Побут в польових умовах».", "Практика з НРК, БпЛА і РЕБ — по 2–3 хвилини на кожного.", "РЕБ впливає на коптери, FPV і НРК."], "test": [["Як Програма формулює технологічну перевагу у предметі «Інноваційні технології»?", ["Дрон — це «очі» відділення. РЕБ — це реальність", "Техніка важливіша за підготовку людей", "Дрони повністю замінюють піхоту в бою", "Техніка важливіша за підготовку людей, а дрони повністю замінюють піхоту"], "Це ключова теза предмета, винесена в Програмі як «ВАЖЛИВО!»."], ["Що курсанти роблять на занятті з платформи «Delta»?", ["Реєструються в системі під наставництвом керівника і обліковуються в кімнаті взводу", "Лише дивляться презентацію без реєстрації", "Слухають огляд платформи, а реєструються самостійно вдома після закінчення курсу, якщо захочуть", "Здають залік з користування платформою"], "Курсанти під наставництвом реєструються в «Delta» і обліковуються в кімнаті навчального взводу."], ["Які навчальні платформи вивчають на курсі?", ["«Prometheus», «Combat 4» та «Армія+»", "«Кропива», «Тенета» і «FireFly»", "«Delta», «VEZHA» і «Signal»", "«Армія+», «Кропива» і «Дія»"], "До військовослужбовців доводять «Prometheus», «Combat 4» та «Армія+»."], ["Які курси в «Армія+» треба пройти у вільний час?", ["«Delta» і «Побут в польових умовах»", "«Кропива» і «Основи РЕБ»", "«Англійська мова» і «Історія війська»", "«Такти управління і тактикою."], ["Скільки тем містить предмет «Інноваційні технології»?", ["П’ять: Delta, застосунки, НРК, БпЛА, РЕБ", "Три: Delta, НРК, РЕБ", "Чотири: Delta, БпЛА, РЕБ, зв’язок", "Шість: Delta, Кропива, НРК, БпЛА, РЕБ, зв’язок"], "Предмет має п’ять тем."], ["Що потрібно дотримуватися під час практичного застосування НРК і БпЛА на заняттях?", ["Заходів безпеки, які доводить інструктор", "Вказівок товариша, який уже літав", "Лише інструкції виробника пристрою", "Ніяких обмежень на полігоні немає"], "Особовому складу демонструють порядок управління і доводять заходи безпеки під час застосування."]]}, {"id": "t10", "mod": "Модуль II – Вдосконалення", "src": "Тема 4.2.3", "title": "Тактична догоспітальна допомога", "short": "Тактична медицина", "sections": [{"h": "Кожен командир — рятувальник", "body": [["key", "«Золота година»: кожен командир — рятувальник. Він відповідає за життя."], ["p", "Прискорений курс тактичної догоспітальної допомоги базового рівня — 8 годин: одна теоретична і сім практичних. На практичних заняттях курсанти мають індивідуальну зброю і засоби захисту — шолом, бронежилет; використовують аптечки АМЗІ, засоби імітації травм, турнікети."]]}, {"h": "Три етапи допомоги і протокол MARCH", "body": [["p", "Допомога надається поетапно: <b>Допомога під вогнем</b> → <b>Допомога в тактичному укритті</b> (у польових умовах) → <b>Евакуація</b>. На кожному етапі — свої дії і пріоритети."], ["p", "Послідовність огляду і допомоги — протокол <b>M.A.R.C.H.</b>"], ["ul", ["<b>M</b> — масивна кровотеча;", "<b>A</b> — прохідність дихальних шляхів;", "<b>R</b> — дихання;", "<b>C</b> — кровообіг;", "<b>H</b> — гіпотермія і травма голови."]], ["p", "Розшифровка — довідково, за стандартом TCCC. Саме в цьому порядку побудовані заняття курсу: кровотеча — дихання — кровообіг — гіпотермія — евакуація."]]}, {"h": "Допомога під вогнем", "body": [["p", "Пріоритет — особиста безпека, вогнева перевага, маскування і охорона території. Постраждалого роззброюють і вилучають у нього засоби зв’язку. Комунікація — з використанням укриття і прикриття."], ["p", "Порядок зупинки масивної кровотечі під вогнем:"], ["ul", ["<b>доповідь, дозвіл, допомога</b>;", "комунікація з постраждалим і скерування його в укриття;", "правильне складання турнікета і розміщення на спорядженні;", "турнікет на кінцівку — у самодопомозі та взаємодопомозі."]], ["p", "Переміщення: оцінка свідомості і положення на боці для непритомного; переміщення самостійно і в групі без додаткового обладнання — перетягування або перенесення."], ["p", "Ознаки масивної кровотечі — перше, що треба вміти розпізнати."]]}, {"h": "Кровотеча в тактичному укритті", "body": [["ul", ["тимчасова зупинка прямим тиском на рану руками;", "особливості накладання турнікета на етапі Допомоги в тактичному укритті;", "оцінка ефективності раніше накладеного турнікета;", "<b>другий турнікет</b>, якщо кровотеча не припиняється;", "тампонування рани."]]]}, {"h": "Дихання і кровообіг", "body": [["p", "<b>Дихання</b>: ознаки порушення дихання, порядок огляду грудної клітки. Усі відкриті та всмоктувальні рани грудної клітки закривають <b>оклюзійними наліпками</b>, застосовують техніку «вентилювання»."], ["p", "<b>Кровообіг</b>: оцінка пульсу, визначення рівня свідомості, оцінка ефективності зупинки кровотечі, основні ознаки шоку, переміщення попередньо накладеного турнікета."]]}, {"h": "Гіпотермія і евакуація", "body": [["p", "Відпрацьовують різні методи запобігання розвитку гіпотермії."], ["p", "Етап Евакуації: передача інформації про постраждалого за <b>MIST-рапортом</b>, заповнення картки пораненого, використання м’яких, гнучких, жорстких та імпровізованих нош. Взвод ділиться на відділення по 5–6 осіб з інструкторами."], ["p", "MIST — довідково: механізм травми, виявлені травми, ознаки стану, надана допомога."]]}, {"h": "Симуляція", "body": [["p", "Фінальне заняття — симуляція в бойовій обстановці: холості набої, вибух-пакети, дими, акустичні системи, транспорт, грим, імітація крові. Нарощується психологічне навантаження."], ["p", "Співвідношення керівників до курсантів — <b>не більше 1 до 6</b>. Наприкінці — дебрифінг і АПД."]]}], "keys": ["Кожен командир — рятувальник; «золота година».", "Етапи: під вогнем — у тактичному укритті — евакуація.", "MARCH: кровотеча — дихальні шляхи — дихання — кровообіг — гіпотермія/голова.", "Під вогнем: доповідь, дозвіл, допомога; турнікет, укриття.", "Кровотеча не зупинилась — другий турнікет; рана грудей — оклюзійна наліпка; передача — MIST."], "test": [["Як Програма формулює принцип «золотої години»?", ["Кожен командир — рятувальник. Він відповідає за життя", "Допомогу надають лише медики після закінчення бою", "Командир спочатку виконує завдання, а потім рятує", "Головне — доставити пораненого в госпіталь за годину"], "Командир відповідає за життя підлеглих і повинен уміти рятувати."], ["Яка послідовність етапів надання допомоги?", ["Допомога під вогнем — допомога в тактичному укритті — евакуація", "Евакуація — допомога під вогнем — допомога в тактичному укритті", "Допомога в тактичному укритті — евакуація — допомога під вогнем", "Допомога під вогнем — евакуація — допомога в тактичному укритті"], "Допомога надається поетапно від небезпечного до безпечнішого середовища."], ["Що в протоколі MARCH стоїть на першому місці?", ["Масивна кровотеча", "Прохідність дихальних шляхів", "Оцінка дихання і грудної клітки", "Запобігання гіпотермії"], "M — масивна кровотеча: найшвидша причина смерті, яку можна зупинити на місці."], ["Який порядок дій під час зупинки масивної кровотечі на етапі Допомоги під вогнем?", ["Доповідь, дозвіл, допомога", "Допомога, доповідь, дозвіл", "Перев’язка, шина, евакуація", "Чекати медика"], "Перший пункт порядку — доповідь, дозвіл, допомога."], ["Що роблять із засобами постраждалого на етапі Допомоги під вогнем?", ["Роззброюють постраждалого і вилучають засоби зв’язку", "Залишають зброю і рацію при ньому, щоб не втратити", "Передають зброю найближчому командиру після бою", "Знімають бронежилет і шолом для огля ційні бомби, ударні БпЛА і баражувальні боєприпаси", "Цивільні вантажівки і польові кухні противника", "Метеостанції і генератори на позиціях противника", "Цивільні вантажівки, польові кухні та метеостанції противника, які не становлять загрози"], "Візуальна ідентифікація: ракети і РСЗВ, авіація, КАБ, ударні БпЛА, баражувальні боєприпаси, інженерна техніка."], ["Що обов’язково доводять до особового складу після вивчення противника?", ["Заходи протидії противнику", "Біографії командирів противника", "Пропагандистські матеріали", "Нічого більше"], "Окрім інформації, до особового складу доводяться заходи протидії противнику."], ["Яку роль виконує одне з відділень під час тактичного заняття з маршу?", ["Дозорного відділення", "Резерву командира бригади", "Кухонного наряду", "Спостерігачів без зброї"], "Одне відділення — дозорне, два інші — основні сили."]]}, {"id": "t13", "mod": "Модуль II – Вдосконалення", "src": "Тема 4.2.7", "title": "Військова топографія і програмний комплекс «Кропива»", "short": "Топографія і «Кропива»", "sections": [{"h": "Топографічні карти", "body": [["ul", ["поняття військово-топографічної карти, поділ карт за призначенням;", "масштаб, види масштабів, поділ карт за масштабами;", "<b>легенда карти</b> — яка інформація в ній подана;", "підготовка карти до роботи та її зберігання;", "опрацювання азимутальних карток за допомогою карти, читання карти;", "призначення <b>топографічної лінійки</b> і робота з нею."]]]}, {"h": "Координати і відстані", "body": [["p", "Види координат; визначення координат об’єктів і цілей на карті засобами географічного позиціювання з різною точністю."], ["p", "Системи координат <b>УСК-2000, WGS-84 і MGRS</b> та їх різниця; нанесення точки на карту і зчитування координат у кожній системі; перехід від однієї системи до іншої."], ["p", "Абсолютна висота точки — за <b>Балтійською системою висот</b>. Також — порядок вимірювання відстаней на місцевості."], ["key", "Усі в підрозділі мають працювати в одній системі координат: пом  без системи", "За висотою найближчого пагорба", "За GPS без уточнення"], "Порядок визначення абсолютної висоти точки — за Балтійською системою."], ["Що подано в легенді карти?", ["Пояснення умовних знаків і інформація про карту", "Бойовий наказ і задум командира на карті", "Список особового складу і позивні", "Маршрут руху і графік привалів"], "Курсантам пояснюють, яка інформація подана в легенді карти."], ["Які розрахункові завдання розв’язують у ПК «Кропива» на прикладах?", ["Розрахунок маршу, зони вогневого ураження і артилерійських поправок", "Розрахунок зарплати і грошового забезпечення", "Розрахунок грошового забезпечення, норм харчування особового складу і витрати пального на марші", "Облік пального і запчастин на складі частини"], "Приклади: марш, зони вогневого ураження, артилерійські поправки."], ["Який модуль «Кропиви» відповідає за автоматичну передачу даних, об’єктів і орієнтирів у групі?", ["«Тенета групи»", "«Секундомір»", "«Карта висот»", "«Конвертер кутів»"], "Налаштування автоматичної передачі — за допомогою модуля «Тенета групи»."], ["Через які канали зв’язку налаштовують автоматичну передачу даних у «Тенета групи»?", ["«Радіо» і «Signal»", "Пошта і факс", "Лише дротовий телефон", "Голуби"], "Канали зв’язку — «Радіо» та «Signal»."], ["Яка з функцій належить до ПК «Кропива»?", ["«Пряма видимість»", "«Бойовий листок»", "«Табель обліку»", "«Розклад нарядів»"], "Серед функцій — «Перейти на координати», «Секундомір», «Конвертер кутів», «Розвідка», «Карта висот», «Пряма видимість», «Редактор зон»."], ["Що з наведеного є модулем ПК «Кропива»?", ["«FireFly»", "«Delta Monitor»", "«Армія+»", "«Prometheus»"], "Модулі: «Кропива мапа», «Ресурси Кропива», «Тенета», «Тенета групи», «FireFly»."], ["Для чого служить топографічна лінійка?", ["Для вимірювань на карті — відстаней, масштабів, координат", "Для вимірювання температури і тиску", "Для ремонту і чищення зброї", "Для вимірювання температури і тиску повітря перед польотом БпЛА"], "Вивчається призначення топографічної лінійки та порядок роботи з нею."], ["Як «Кропива» підвищує ефективність ураження цілей?", ["Автоматизацією управління вогнем артилерії і передачею цілевказівок цифровими каналами", "Заміною артилерії ударними дронами в кожному підрозділі", "Заміною артилерійських підрозділів ударними дронами, які самостійно знаходять і вражають цілі без участі людей", "Ручними розрахунками на папері замість комп’ютера"], "Поєднання апаратних і програмних засобів, автоматизація розрахунків і цифрова передача команд."], ["Скільки годин відводиться на практичне використання функцій «Кропиви»?", ["3 години", "15 хвилин", "10 годин", "Практики немає"], "Заняття 3 «Використання функцій ПК «Кропива»» — 3 години на полігоні."], ["Як на підсумковому контролі перевіряють навички з топографії?", ["Під час маршу: орієнтування, рух за азимутом, обхід перешкод", "Письмовим тестом з умовних знаків у класі", "Письмовим тестом з умовних знаків і масштабів карт у класі напередодні виходу", "Не перевіряють — топографія лише теоретична"], "На марші оцінюють орієнтування, рух за азимутом, обхід перешкод і дотримання напрямку."], ["Чому важливо вміти переходити від однієї системи координат до іншої?", ["Різні засоби і підрозділи можуть працювати в різних системах; помилка системи дає помилку в цілі", "Це потрібно тільки для складання іспиту в навчальному центрі", "Перехід потрібен лише для складання іспиту в навчальному центрі; у бойовій роботі всі системи однакові й взаємозамінні", "Щоб ускладнити роботу противнику з перехопленими даними"], "Різниця між системами може зміщувати точку; тому вивчають і різницю, і порядок переходу."]]}, {"id": "t14", "mod": "Модуль III – Вишкіл", "src": "Теми 4.3.1, 4.3.2, додаток 6", "title": "Підготовка до бою, процедура планування (TLP) і управління вогнем", "short": "Планування бою і управління вогнем", "sections": [{"h": "Всебічне забезпечення бою", "body": [["p", "Робота командира відділення з підготовки до бою починається з розуміння видів всебічного забезпечення, його мети і порядку організації."], ["ul", ["<b>бойове забезпечення</b> — заходи під час підготовки і ведення бою;", "<b>морально-психологічне</b> забезпечення;", "<b>технічне</b> — вибір місця пункту боєпостачання і вимоги до нього, поповнення боєприпасів;", "<b>тилове</b> — харчування, відпочинок, відхоже місце, заправлення машин ПММ;", "<b>медичне</b> — евакуація поранених, роль стрільця-санітара, місце збору поранених, робота в різних зонах."]]]}, {"h": "Бойовий наказ", "body": [["p", "Дії командира відділення з отриманням бойового наказу, порядок роботи з підготовки загальновійськового бою, пункти і порядок віддання бойового наказу."], ["p", "На тренінгу кожен курсант у ролі командира відділення отримує бойовий наказ рівня командира взводу, розробляє наказ свого рівня і віддає його інструктору, доповідаючи порядок виконання завдання."], ["p", "Робота командира з організації бою має сталу послідовність: <b>усвідомлює завдання → оцінює обстановку → приймає рішення → проводить рекогносцировку → віддає бойовий наказ → організовує взаємодію, управління і всебічне забезпечення</b>."]]}, {"h": "Бойові документи", "body": [["p", "Види текстуальних і графічних бойових документів; робота з картою і орієнтування за нею; <b>тактичні знаки</b> і порядок їх нанесення відповідно до обстановки. На практиці кожен отримує індивідуальне завдання з розробки текстуального і графічного документа."]]}, {"h": "Процедура планування бою (ППБ / TLP)", "body": [["p", "ППБ базується на <b>Troop Leading Procedures (TLP)</b> і складається з <b>восьми взаємопов’язаних кроків</b>. Довідково, за стандартом TLP:"], ["ul", ["<b>1.</b> Отримати завдання.", "<b>2.</b> Віддати попереднє бойове розпорядження.", "<b>3.</b> Скласти попередній план (замисел).", "<b>4.</b> Розпочати необхідний рух.", "<b>5.</b> Провести рекогносцировку.", "<b>6.</b> Завершити план.", "<b>7.</b> Віддати бойовий наказ.", "<b>8.</b> Контролювати і уточнювати."]], ["p", "На практиці групи отримують картки з бойовим наказом (БН) або бойовим розпорядженням (БР) — письмово або аудіозаписом усного БР, — проводять процедуру і разом з інструктором аналізують створений документ. Обговорюють типові помилки планування."]]}, {"h": "Основи управління вогнем", "body": [["p", "Вимоги до вогню, які <b>завчаються напам’ять</b>:"], ["ul", ["<b>точність</b>;", "<b>раптовість</b>;", "<b>своєчасність</b>;", "<b>масованість</b>."]], ["p", "Курсанти тренуються подавати команди на управління вогнем і ставити вогневі завдання кожному відповідно до його посади — на макеті місцевості, міні-полігоні, тренажерах. Командира призначають почергово."]]}, {"h": "Вправи з управління вогнем", "body": [["p", "Практичні вправи — 7 годин, з них 2 у темну пору: управління вогнем в оборонному бою, під час штурмових дій у лісистій місцевості і вночі. Курсанти по черзі — командири відділень і головні сержанти взводу."], ["p", "Перед вправою командир: отримує і аналізує завдання, оцінює обстановку, віддає попереднє бойове розпорядження, виробляє замисел, проводить рекогносцировку, формує рішення, готує і віддає бойовий наказ, проводить організаційну роботу."], ["p", "<b>Ліс</b>: 10 цілей на відстані 20–200 м, вогонь з-за товстих стовбурів і з близьких відстаней серед тонких дерев, виявлення мінних загороджень і пророблення проходу для техніки, закріплення і передача позицій. Придано екіпаж БпЛА."], ["p", "<b>Ніч</b>: цілі з джерелом тепла для тепловізорів і приладів нічного бачення, 6–10 цілей на ділянці до 200 м, рух відділення коригується з БпЛА з нічною камерою — 2 екіпажі."], ["key", "«Виконано» — завдання виконане, і командир правильно ставив вогневі завдання, приймав рішення і подавав команди по всіх цілях. Порушення заходів безпеки — «не виконано»."]]}], "keys": ["Послідовність командира: усвідомив — оцінив — вирішив — рекогносцировка — наказ — взаємодія, управління, забезпечення.", "ППБ / TLP — вісім взаємопов’язаних кроків.", "Вимоги до вогню напам’ять: точність, раптовість, своєчасність, масованість.", "Всебічне забезпечення: бойове, морально-психологічне, технічне, тилове, медичне.", "У вправах екіпаж БпЛА веде розвідку, цілевказання і коригування."], "test": [["Які вимоги до вогню курсанти завчають напам’ять?", ["Точність, раптовість, своєчасність, масованість", "Гучність, яскравість, тривалість, швидкість", "Економність, безшумність, повільність, точність", "Масованість, тривалість, далекобійність, гучність"], "Чотири вимоги до вогню вивчаються напам’ять на занятті з управління вогнем."], ["Скільки кроків має процедура планування бою на основі TLP?", ["Вісім", "Три", "П’ять", "Дванадцять"], "Викладач розповідає про вісім взаємопов’язаних кроків ППБ."], ["Який крок TLP іде одразу після отримання завдання?", ["Віддати попереднє бойове розпорядження", "Провести рекогносцировку району майбутніх дій", "Провести рекогносцировку", "Розпочати необхідний рух"], "Попереднє розпорядження дає підлеглим час на підготовку, поки командир планує."], ["Який крок TLP останній?", ["Контролювати і уточнювати", "Віддати бойовий наказ", "Завершити план", "Провести рекогносцировку"], "Восьмий крок — контроль і уточнення під час підготовки і виконання."], ["Яка правильна послідовність роботи командира з організації бою?", ["Усвідомлює завдання, оцінює обстановку, приймає рішення, проводить рекогносцировку, віддає наказ, організовує взаємодію", "Віддає наказ, проводить рекогносцировку, потім усвідомлює завдання і оцінює обстановку", "Проводить рекогносцировку, організовує взаємодію, потім приймає рішення і отримує завдання", "Віддає бойовий наказ, проводить рекогносцировку, організовує взаємодію, а потім оцінює обстановку і усвідомлює завдання"], "Ця послідовність повторюється в усіх темах тактичної підготовки."], ["Що з наведеного належить до технічного забезпечення бою?", ["Вибір місця пункту боєпостачання і поповнення боєприпасів", "Евакуація поранених і робота стрільця-санітара", "Організація харчування і відпочинку", "Евакуація поранених, робота стрільця-санітара і місце збору поранених"], "Технічне забезпечення включає вибір місця пункту боєпостачання і порядок поповнення боєприпасів."], ["Що з наведеного належить до медичного забезпечення бою?", ["Евакуація поранених, роль стрільця-санітара, місце збору поранених", "Заправлення машин ПММ і організація харчування", "Заправлення машин ПММ, організація харчування і вибір місця відхожого місця", "Ремонт озброєння в районі зосередження"], "Медичне — евакуація, стрілець-санітар, місце збору поранених і робота в різних зонах."], ["Що отримують групи на практичному занятті з ППБ?", ["Картки з бойовим наказом або бойовим розпорядженням, письмово чи аудіозаписом", "Лише усні поради інструктора без документів", "Готові розв’язки, які треба лише переписати", "Лише готову схему бою на карті, яку треба переписати в робочий зошит без аналізу помилок"], "Задача групи — провести процедуру і проаналізувати створений БН або БР з інструктором."], ["Що означають скорочення БН і БР?", ["Бойовий наказ і бойове розпорядження", "Бойова норма і бойовий резерв", "Бронетехніка навчальна і бронетехніка резервна", "Бригадний наказ і батальйонний рапорт"], "БН — бойовий наказ, БР — бойове розпорядження."], ["Коли вправу з управління вогнем оцінюють «не виконано»?", ["Якщо завдання не виконане або порушені заходи безпеки", "Якщо витрачено всі патрони до кінця вправи", "Якщо вправа тривала довше однієї години", "Якщо витрачено всі патрони до кінця вправи або вправа тривала довше години"], "Порушення заходів безпеки автоматично означає «не виконано»."], ["Яку роль виконує екіпаж БпЛА у вправі з управління вогнем у лісистій місцевості?", ["Аеророзвідка, цілевказання, коригування вогню", "Доставка боєприпасів і евакуація поранених", "Дистанційне мінування підступів", "Доставка боєприпасів відділенню"], "Придані засоби — БпЛА для аеророзвідки, цілевказання і коригування вогню."], ["Як позначені цілі у нічній вправі з управління вогнем?", ["Обладнані джерелом підвищення температури для тепловізорів і ПНБ", "Підсвічені прожекторами з вишки керівника стрільби, щоб їх було добре видно", "Пофарбовані яскравою світловідбивною фарбою", "Не позначені — їх шукають навмання"], "Цілі обладнані джерелом тепла для теплової візуалізації з БпЛА і приладів нічного бачення."], ["Що з наведеного відпрацьовують у вправі в лісистій місцевості?", ["Вогонь з-за товстих стовбурів і пророблення проходу в мінних загородженнях для техніки", "Стрільбу по повітряних цілях на дальність до 3 км", "Переправу через водну перешкоду на човнах", "Стрільбу по повітряних цілях на великих дальностях і переправу через водну перешкоду на підручних засобах"], "Завдання включають вогонь з-за дерев, на близьких відстанях, виявлення МВЗ і пророблення проходу."], ["Що вивчають на занятті «Бойові документи»?", ["Текстуальні і графічні документи, роботу з картою і тактичні знаки", "Фінансові звіти і облік майна підрозділу", "Особові справи і характеристики", "Фінансові документи, облік майна підрозділу, табелі робочого часу і порядок складання звітів"], "Види документів, орієнтування за картою, тактичні знаки і порядок їх нанесення."], ["Де тренуються подавати команди на управління вогнем на першому занятті?", ["На макеті місцевості, міні-полігоні, тренажерах, у класах управління боєм", "Лише на бойовому стрільбищі з бойовими набоями", "Одразу на бойовому стрільбищі з бойовими набоями, щоб умови були максимально наближені до бою", "У навчальному класі за підручником без макета"], "Місце проведення — макет місцевості, міні-полігон, тренажери, класи управління боєм."]]}, {"id": "t15", "mod": "Модуль IV – Закріплення", "src": "Тема 4.4.1 (теми 1–3)", "title": "Тактична підготовка: марш, район зосередження, оборона", "short": "Марш і оборона", "sections": [{"h": "Марш", "body": [["p", "Вимоги до організації маршу: робота командира відділення під час підготовки і здійснення маршу в складі взводу; <b>похідний порядок взводу</b>, дистанції і середня швидкість руху; місце відділення в похідному порядку; елементи бойового порядку на марші."], ["p", "Подолання лінійних перешкод — доріг, ярів, водних перешкод — різними способами: біля водоймищ, на воді, у тумані. Маршрут проходить через різну місцевість: лісостеп, степ, місто."]]}, {"h": "Марш у складних умовах", "body": [["p", "Практика 4 години, з них 2 вночі. Взвод діє трьома відділеннями: одне — <b>дозорне</b>, два — основні сили; пішки і на техніці; маршрут <b>до 5 км</b>; частину шляху — <b>малими тактичними групами</b>."], ["p", "На маршруті — засідки, дистанційне мінування, завали, артилерійські й авіаційні удари, задимлення. Курсанти по черзі командують, позначаються втрати — щоб формувати незламну волю до перемоги. Після кожної ділянки — короткий розбір і зміна командирів."], ["p", "Оцінюють <b>не менше 70%</b> курсантів."]]}, {"h": "Район зосередження", "body": [["p", "Основна мета перебування в районі зосередження (очікування) — <b>відпочинок особового складу і підготовка до подальшого виконання бойового завдання</b>: заняття, ремонт озброєння і техніки."], ["p", "Вимоги до розміщення людей і техніки, організація охорони, маскування й інженерне обладнання. Робота командира: усвідомлення завдання, оцінка обстановки, рішення, рекогносцировка, завдання підлеглим, взаємодія, управління, забезпечення; вимоги до <b>безпосередньої охорони</b>."]]}, {"h": "Взвод (відділення) в обороні", "body": [["p", "<b>Умови переходу до оборони</b>: після завершення атаки, при виході з бою, під час зустрічного бою, у разі потрапляння в засідку."], ["p", "Також: розміри позицій і взводних опорних пунктів (ВОП) по фронту і в глибину, бойовий порядок, послідовність роботи командира. Система оборони включає:"], ["ul", ["<b>систему вогню</b> — смуга вогню, додатковий сектор обстрілу, ділянки зосередження вогню;", "систему всебічного забезпечення;", "<b>систему інженерних загороджень</b> — розвідка, фортифікація, загородження, проходи, маскування, захист від ВТЗ;", "систему управління — зв’язок у ланці відділення–взвод–рота, дії за командами і сигналами;", "систему протитанкової оборони — основні й запасні позиції ПТ засобів;", "елементи протиповітряної оборони — місце <b>спостерігача за повітрям</b>;", "систему бойової охорони — позиція, смуга спостереження, дії в різних ситуаціях."]]]}, {"h": "Позиції бойових груп", "body": [["p", "Позиції бойових груп (двійок, трійок) і відділення бувають <b>тимчасові, основні, запасні та укриття</b>. Їх займають з урахуванням місцевості — степ, ліс, місто — під час зіткнення з противником і за його відсутності."], ["p", "Обладнання позиції: маскування, місця для додаткового боєкомплекту, прийому їжі, відпочинку, природних потреб і <b>укриття від артилерійських та авіаційних ударів</b>; розміщення в укриттях за межами ВОП з можливістю швидкого виходу на вогневі позиції."]]}, {"h": "Система вогню в обороні", "body": [["ul", ["зона вогню переносних протитанкових засобів;", "зона <b>суцільного багатошарового вогню</b> штатних і доданих засобів перед переднім краєм, у проміжках, на флангах і в глибині;", "ділянки зосередженого вогню взводу;", "<b>підготовлений маневр вогнем</b>."]]]}, {"h": "Картка вогню відділення", "body": [["ul", ["напрямок на північ;", "орієнтири, їхні номери, назви і відстані;", "положення противника і його вогневих засобів, ймовірний напрямок наступу;", "позиція відділення, смуга вогню і додатковий сектор обстрілу;", "основні та запасні (тимчасові) позиції гранатометника і кулеметника, сектори обстрілу з кожної позиції;", "рубежі відкриття вогню з протитанкових засобів, гранатометів і стрілецької зброї;", "позиції сусідів, ділянки зосередженого вогню взводу і місце в них відділення, інженерні загородження."]], ["p", "Кожен курсант оформлює типову картку вогню <b>не менше 3 разів</b>."]]}, {"h": "Дії в обороні на практиці", "body": [["p", "Висування на позицію: вихід у район зосередження → рекогносцировка → зайняття ВОП → уточнення завдань на місцевості → картка вогню → оборона від FPV-дронів, танків і ДРГ разом з інженерним обладнанням. Одна з груп імітує противника."], ["p", "Процедура планування оборонного бою — кожен отримує бойове розпорядження і організовує бій за Бойовим статутом; оцінюють не менше 80% курсантів."], ["p", "Заняття «Дії відділення (взводу) в обороні» — 10 годин. Дві складові: робота командира з організації бою і практичне управління — дії в районі зосередження, висування, зайняття ВОП, оборонний бій і <b>бій в оточенні</b>. Командира міняють на будь-якому етапі, обстановка — без пауз і перерв, як у реальному бою."]]}], "keys": ["Марш до 5 км; дозорне відділення + основні сили; частина — малими тактичними групами.", "Район зосередження — для відпочинку і підготовки до наступного завдання.", "Перехід до оборони: після атаки, при виході з бою, у зустрічному бою, у засідці.", "Позиції: тимчасові, основні, запасні, укриття.", "Картка вогню: північ, орієнтири, противник, смуга і сектори, позиції, рубежі, сусіди, загородження."], "test": [["Яка основна мета перебування підрозділу в районі зосередження (очікування)?", ["Відпочинок особового складу і підготовка до подальшого виконання бойового завдання", "Ведення оборонного бою з противником, що наступає", "Ведення оборонного бою з противником, що наступає, і утримання займаного рубежу до підходу резервів", "Проведення урочистих заходів і нагородження особового складу"], "Мета — відпочинок і підготовка: заняття, ремонт озброєння і техніки."], ["За яких умов відділення (взвод) переходить до оборони згідно з Програмою?", ["Після завершення атаки, при виході з бою, у зустрічному бою, у разі потрапляння в засідку", "Лише за письмовим наказом старшого командира, отриманим заздалегідь, і лише на заздалегідь обладнаних позиціях", "Тільки в мирний час на заздалегідь обладнаних позиціях", "Лише вночі після відходу основних сил підрозділу"], "Це чотири умови переходу до оборони, що доводяться на занятті."], ["Які елементи входять до системи вогню відділення в обороні?", ["Смуга вогню, додатковий сектор обстрілу, ділянки зосередження вогню", "Маршрут руху, рубежі регулювання, пункти привалів і місце командира на марші", "Пункт харчування, місце відпочинку і склад", "Рубіж спішування, рубіж атаки і рубіж розгортання"], "Система вогню: смуга вогню, додатковий сектор, ділянки зосередження вогню."], ["Які види позицій бойових груп розрізняє Програма?", ["Тимчасові, основні, запасні та укриття", "Лише основні та запасні, бо тимчасові позиції не обладнують", "Літні, зимові та всесезонні", "Денні, нічні та цілодобові"], "Вимоги до вибору позицій — тимчасових, основних, запасних і укриття."], ["Що позначається на картці вогню відділення першим пунктом?", ["Напрямок на північ", "Прізвища особового складу", "Меню", "Номери автоматів"], "Послідовність оформлення починається з напрямку на північ."], ["Скільки разів кожен курсант оформлює типову картку вогню на занятті?", ["Не менше 3 разів", "Один раз", "Не менше 10 разів", "Не оформлює — лише дивиться зразок"], "Практично відпрацьовують оформлення типової картки вогню не менше 3 разів."], ["Яким є елемент протиповітряної оборони відділення в обороні?", ["Місце спостерігача за повітрям", "Зенітний ракетний комплекс", "Радіолокаційна станція полку", "Позиція великокаліберного кулемета"], "Елементи системи ППО — місце спостерігача за повітрям."], ["Яка протяжність маршруту на практичному занятті з маршу?", ["До 5 км", "До 500 м", "20–30 км", "100 км"], "Протяжність маршруту руху складає до 5 км."], ["Як розподіляються відділення взводу на практичному занятті з маршу?", ["Одне — дозорне, два — основні сили", "Усі три — основні сили", "Два — дозорні, одне — резерв", "Одне — резерв, два — дозорні"], "Одне відділення виступає в ролі дозорного, два інші — основні сили."], ["Навіщо під час навчального маршу позначають втрати серед особового складу?", ["Щоб формувати незламну волю до перемоги і виконання завдання", "Щоб визначити найслабших і відрахувати їх з курсу", "Щоб скоротити тривалість заняття", "Для статистики навчального центру"], "Програма прямо пояснює: втрати позначаються для формування незламної волі."], ["Що з наведеного є складовою системи вогню взводу в обороні?", ["Підготовлений маневр вогнем", "Маршрут евакуації техніки в тил", "Стройовий плац", "Пункт видачі речового майна"], "Складові: зона ПТ засобів, зона суцільного багатошарового вогню, ділянки зосередженого вогню, підготовлений маневр вогнем."], ["Скільки щонайменше курсантів оцінюють на занятті «Процедура планування оборонного бою»?", ["Не менше 80%", "Не менше 10%", "Лише одного", "Нікого"], "Під час заняття викладач оцінює не менше 80% тих, хто навчається."], ["Що передбачено при обладнанні позиції в обороні?", ["Укриття від артилерійських і авіаційних ударів, місця для додаткового БК і відпочинку", "Лише бруствер і бійниця для стрільби без додаткових укриттів", "Лише бруствер і бійниця для стрільби, бо укриття та місця відпочинку демаскують позицію", "Освітлення позиції вночі для зручності руху особового складу"], "Вимоги включають маскування, місця для БК, їжі, відпочинку, потреб і укриття від ударів."], ["Від яких загроз організують оборону на практичному занятті з висування на позицію?", ["Від FPV-дронів, танків і ДРГ противника в комплексі з інженерним обладнанням", "Лише від піхоти противника без урахування техніки і дронів", "Лише від авіації противника без інженерного обладнання", "Лише від піхоти противника; дрони й техніка розглядаються на інших заняттях без інженерного обладнання"], "Організація оборони від FPV, танків, ДРГ разом з інженерним обладнанням позицій."], ["Що відпрацьовують у другій складовій заняття «Дії відділення (взводу) в обороні»?", ["Практичне управління: висування, зайняття ВОП, оборонний бій і бій в оточенні", "Лише теоретичне вивчення Бойового статуту в класі та оформлення бойових документів", "Стройову підготовку і перевірку зовнішнього вигляду", "Заповнення бойових документів без виходу на місцевість"], "Друга складова — управління підрозділом у ході бою, включно з боєм в оточенні."]]}, {"id": "t16", "mod": "Модуль IV – Закріплення", "src": "Тема 4.4.1 (тема 4)", "title": "Наступальний бій і бій у населеному пункті", "short": "Наступ і бій у місті", "sections": [{"h": "Взвод (відділення) в наступі", "body": [["p", "Наступальний бій — найбільша тема курсу: <b>48 годин</b>."], ["ul", ["<b>умови наступу</b>: з висуванням з глибини (з ходу) і з положення безпосереднього зіткнення з противником;", "рубежі розгортання і тактичні нормативи до них;", "<b>вогнева підготовка атаки</b>: вогонь прямою наводкою і з закритих позицій;", "бойовий порядок відділення (взводу): <b>вогнева і маневрена групи</b> та порядок їх застосування;", "місце командира в бойовому порядку;", "<b>способи атаки</b>: у пішому порядку, на машинах, раптово або після вогневої підтримки."]]]}, {"h": "Рубежі під час наступу", "body": [["p", "Під час рекогносцировки командир визначає маршрути прихованого висування і рубежі:"], ["ul", ["розгортання у взводні колони;", "переходу в атаку;", "спішування;", "<b>безпечного віддалення від розривів своїх снарядів і мін</b>;", "розподілу на маневрову і вогневу групи."]], ["p", "На груповій вправі «Підготовка до наступального бою» курсанти організовують наступ з ходу: усвідомлюють завдання, оцінюють обстановку, приймають рішення, визначають рубежі на карті або макеті, відпрацьовують бойовий наказ, організовують взаємодію, управління і забезпечення."]]}, {"h": "Наступ в урбанізованій місцевості", "body": [["p", "Особливості бойового порядку в місті, застосування танків і бойових машин та груп їх прикриття."], ["p", "<b>Штурмові групи</b> складаються з підгруп: захоплення, управління і вогневої підтримки, розгородження, прикриття. Захоплення будівель, їх зачистка і обладнання в них позицій бойових груп."]]}, {"h": "Зачистка траншей і будівель", "body": [["p", "Два тактико-стройові заняття по 10 годин. Бойовий порядок: <b>вогнева група, маневрена (штурмова) група, місце бойової машини</b>. Управління — жестами, голосом і радіозасобами."], ["key", "Прийом спочатку відпрацьовують у повільному темпі з дотриманням порядку дій, а потім нарощують до темпу реального бою."], ["p", "Рекомендовано застосовувати <b>«ЛАЗЕРТАГ» або «ПЕЙНТБОЛ»</b>."]]}, {"h": "Штурм і зачистка населеного пункту", "body": [["p", "Заняття — 10 годин, з них 2 вночі. Відпрацьовують нормативи з тактичної підготовки <b>Н-Тк-33, 34, 35</b> — знищення противника з охопленням у фланг, з охопленням у фланг і атакою з фронту."], ["p", "<b>Під час штурму</b>: переміщення населеним пунктом, перетин перехресть і відкритих ділянок, вибір місць для стрільби — вікно, горище, дах, підвал, проломи в стінах, укриття в підвалах під час обстрілу, протидія гранатометникам, переміщення між будівлями під вогнем снайперів і кулеметів, штурм будівлі, допомога пораненим, доповідь."], ["p", "<b>Під час зачистки</b>: огляд вулиць, промислових і багатоповерхових будівель; <b>поярусне спостереження</b> з різних сторін вулиці; взаємне прикриття вогнем; дії при виявленні снайперів і МВП; проникнення через проломи, вікна, двері; блокування входів і виходів підземних комунікацій; бій на поверхах."], ["warn", "Окремо відпрацьовують порядок дій на об’єктах під захистом міжнародного гуманітарного права — церкви, мечеті тощо."]]}, {"h": "Бойові стрільби відділення в наступі", "body": [["p", "Заняття — 10 годин, вдень і вночі: штурм траншеї противника з висадкою з техніки. Напередодні, на самопідготовці, курсанти організовують бій: визначають маршрути, рубежі, дії маневрової і вогневої груп, відпрацьовують бойовий наказ."], ["p", "Боєприпаси розподіляють за вправою КС 6.19.2.2: <b>50% на перший етап, 50% — на другий</b>. Мішеневу обстановку планує командир навчального підрозділу відповідно до навченості курсантів."], ["p", "Бойові стрільби відділення і взводу — вища форма навчання в умовах, максимально наближених до бойових: тактичні дії органічно пов’язані з бойовою стрільбою."]]}], "keys": ["Наступ: з ходу (з глибини) або з положення безпосереднього зіткнення.", "Бойовий порядок: вогнева група + маневрена (штурмова) група.", "Рубіж безпечного віддалення від розривів своїх снарядів — обов’язковий у плануванні.", "Спершу повільно і правильно, потім — у темпі реального бою.", "Штурмові підгрупи: захоплення, вогнева підтримка і управління, розгородження, прикриття."], "test": [["За яких умов здійснюється наступ згідно з Програмою?", ["З висуванням з глибини (з ходу) і з положення безпосереднього зіткнення з противником", "Лише з положення оборони після тривалої артилерійської підготовки", "Тільки після авіаційного удару і за умови переваги в техніці", "Лише з положення оборони після тривалої артилерійської підготовки і тільки за умови переваги в техніці"], "Розглядаються дві умови наступу: з ходу і з положення безпосереднього зіткнення."], ["З яких груп складається бойовий порядок відділення в наступальному бою?", ["Вогнева і маневрена групи", "Кухонна і транспортна групи", "Резервна і штабна групи", "Медична і ремонтна групи"], "Бойовий порядок — вогнева і маневрена групи та порядок їх застосування."], ["Які види вогневої підготовки атаки розглядаються?", ["Вогонь прямою наводкою і з закритих позицій", "Лише вогонь зі стрілецької зброї відділення", "Лише удари авіації і крилатих ракет", "Вогнева підготовка атаки не проводиться"], "Види вогневої підготовки атаки — прямою наводкою і з закритих позицій."], ["Який рубіж визначають, щоб уберегти свої підрозділи від власного вогню?", ["Рубіж безпечного віддалення від розривів своїх снарядів і мін", "Рубіж привалу і перевірки особового складу", "Рубіж зустрічі з сусіднім підрозділом для узгодження дій", "Рубіж повернення в район зосередження"], "Рубіж безпечного віддалення визначається під час рекогносцировки разом з іншими рубежами."], ["Якими способами може проводитись атака?", ["У пішому порядку, на машинах, раптово або після вогневої підтримки", "Лише на машинах і лише після артилерійської підготовки", "Лише в пішому порядку і тільки вночі", "Тільки раптово, без будь-якої вогневої підтримки"], "Способи атаки: в пішому порядку, на машинах, раптово або після вогневої підтримки."], ["З яких підгруп складаються штурмові групи в урбанізованій місцевості?", ["Захоплення, управління і вогневої підтримки, розгородження, прикриття", "Кухонна, ремонтна, медична і транспортна підгрупи", "Кухонна, ремонтна, медична і транспортна підгрупи під управлінням командира роти", "Розвідувальна і зв’язку, без вогневої підтримки"], "Штурмові групи: підгрупа захоплення, управління і вогневої підтримки, розгородження, прикриття."], ["Як відпрацьовують прийом зачистки траншеї чи будівлі?", ["Спочатку в повільному темпі з дотриманням порядку дій, потім нарощують до темпу реального бою", "Одразу в максимальному темпі, щоб наблизити до реального бою", "Одразу в максимальному темпі реального бою, щоб курсанти звикали до швидкості з першого ж повторення", "Довільно, без дотримання порядку дій, щоб розвивати ініціативу"], "Від повільного правильного виконання — до темпу реального бою."], ["Які засоби рекомендовано застосовувати на заняттях із зачистки?", ["«ЛАЗЕРТАГ» або «ПЕЙНТБОЛ»", "Бойові гранати і вибухівку", "Цивільні феєрверки", "Жодних — лише макети"], "Програма рекомендує лазертаг або пейнтбол для реалістичного тренування."], ["Як командир управляє підлеглими під час зачистки траншеї?", ["Жестами, голосом і радіозасобами", "Лише письмовими наказами", "Мобільним телефоном у месенджері", "Не управляє"], "Управління — за допомогою жестів, голосу і радіозасобів."], ["Як розподіляються боєприпаси на бойових стрільбах відділення в наступі?", ["50% на перший етап і 50% на другий", "100% на перший етап", "25% на перший і 75% на другий", "75% на перший і 25% на другий"], "Розподіл — за вправою КС 6.19.2.2 з розрахунку 50 на 50 між етапами."], ["Які нормативи з тактичної підготовки відпрацьовують під час штурму населеного пункту?", ["Н-Тк-33, 34, 35", "Н-Вп-1, 2, 3", "Н-Інж-10", "Нормативи не відпрацьовують"], "Нормативи № 33, 34, 35 — знищення противника з охопленням у фланг та атакою з фронту."], ["Що таке поярусне спостереження під час руху вулицею?", ["Спостереження з різних сторін вулиці за вікнами, горищами, дахами і підвалами", "Почергове спостереження одним бійцем за всіма напрямками, поки решта групи рухається без зупинок", "Спостереження з дрона з висоти одного кілометра", "Почергове спостереження одним бійцем за всіма напрямками"], "Організація поярусного спостереження з ураженням противника у вікнах, на горищах, дахах і в підвалах."], ["На яких об’єктах окремо відпрацьовують порядок дій під час зачистки?", ["На об’єктах під захистом міжнародного гуманітарного права — церкви, мечеті тощо", "На заправних станціях і складах пального", "На об’єктах критичної інфраструктури — електропідстанціях, водогонах і мостах, де діють окремі правила", "На стадіонах і спортивних майданчиках"], "Порядок дій на об’єктах під захистом МГП відпрацьовують окремо."], ["Що є вищою формою навчання відділення і взводу?", ["Бойові стрільби в умовах, максимально наближених до бойових", "Лекція в класі з демонстрацією схем бою та переглядом навчальних відео з бойових дій", "Стройовий огляд і перевірка спорядження", "Перегляд навчальних відео з бойових дій"], "За визначенням Програми, бойові стрільби відділення й взводу — вища форма навчання."], ["Хто планує мішеневу обстановку на бойових стрільбах відділення?", ["Командир навчального підрозділу відповідно до навченості курсантів", "Самі курсанти, які виконують стрільбу", "Командир бригади, з якої прибули курсанти", "Курсанти, які виконують стрільбу, разом обирають мішені й розставляють їх напередодні"], "Мішенева обстановка планується командиром навчального підрозділу відповідно до навченості."]]}, {"id": "t17", "mod": "Модуль IV – Закріплення", "src": "Тема 4.4.2, додаток 5", "title": "Вогнева підготовка", "short": "Вогнева підготовка", "sections": [{"h": "Склад предмета", "body": [["p", "Вогнева підготовка — 40 годин, 4 теми: стрілецька зброя і озброєння бойових машин; зовнішня балістика і приведення зброї до нормального бою; перевірка бою і вправи стрільб зі стрілецької зброї та гранатометів; прийоми і способи ведення вогню. Перед початком курсантам доводять загальні положення організації практичних стрільб."]]}, {"h": "Зброя і техніка", "body": [["p", "Призначення, ТТХ, будова, бойові можливості стрілецької зброї та гранатометів відділення — зокрема <b>іноземного виробництва</b>. Озброєння бойових машин відділення."], ["p", "Окремо демонструють <b>слабкі (уразливі) місця броньованої техніки противника</b> і порядок її знищення."]]}, {"h": "Зовнішня балістика", "body": [["p", "Основні терміни балістики стрілецьких калібрів:"], ["ul", ["<b>СТВ</b> — середня точка влучення;", "<b>КТ</b> — контрольна точка;", "<b>ТП</b> — точка прицілювання;", "точність, купність, допустимий габарит купності;", "«прямий постріл», «балістична крива», «балістичний тунель», «перший нуль», «другий нуль»."]], ["p", "Правила прицілювання з різних видів зброї і прицілів, типові помилки стрільця, стрільба із <b>завалом зброї</b> — вплив кута нахилу на СТВ. На практиці розв’язують задачі з приведення зброї до нормального бою і аналізують типові помилки."]]}, {"h": "Перевірка бою і приведення до нормального бою", "body": [["p", "6 годин на стрільбищі: перевірка бою (вивірка прицілів) стрілецької зброї і гранатометів відділення з використанням <b>командирського ящика (КЯ)</b>."], ["p", "На підсумковому контролі курсанта оцінюють саме за перевірку боєм і приведення до нормального бою, а також за організацію і методику проведення заняття."]]}, {"h": "Вправи Курсу стрільб", "body": [["ul", ["КС 2.01(03–04).1.6 — стрільба з місця по цілях, що з’являються, з кулеметів ПКМ (FN-MAG / M249);", "КС 2.06(07).1.1 — стрільба з місця по цілі, що з’являється, з РПГ-7; за відсутності пострілів — КС 1.06.1.1 з ПУС-7 (ПУС AT-4);", "КС 2.01(03).1.28 — по малорозмірних нерухомих цілях;", "КС 6.02(03, 18).1.1 — <b>ведення вогню у складі бойової двійки</b>;", "КС 2.01.1.2 — із-за укриття зі зміною положення з правого і лівого плеча;", "контрольна КС 3.01.2.2 — <b>бій у лісосмузі зі зміною вогневої позиції</b>;", "підготовча № 30 — <b>виявлення та ураження БпЛА малого класу, що рухаються</b>, зі стрілецької зброї зі зміною позиції;", "КС 6.01(18).1.3 — бій у траншеї у складі бойової двійки з бойовою стрільбою; перед ним — вогневе тренування."]], ["p", "Частину вправ виконують уночі. За потреби — підготовчі вправи для поступового навчання."]]}, {"h": "Підготовчі вправи: стандарти точності", "body": [["p", "<b>Кучність на 25 м</b>: без засобів захисту «залік» — 3 пробоїни в колі діаметром 100 мм з положень лежачи і з коліна, 150 мм — сидячи і стоячи. У засобах захисту — 4 пробоїни. Вогонь одиночний, серіями по 5 пострілів; перша серія тренувальна, друга — залікова."], ["p", "<b>Швидкісна стрільба 25–40 м</b> і <b>в русі 10–15 м</b>: 91–100% влучень — «відмінно», 81–90% — «добре», 70–80% — «задовільно». Стрільба з сильної і слабкої руки, із-за укриття, зі зміною магазина."], ["p", "<b>Бойова двійка</b>: один стріляє і прикриває, другий робить перебіжку — і навпаки, до зайняття визначених позицій."]]}, {"h": "Штурм будівлі з маркерами: правила", "body": [["p", "У вправах з пейнтбольними маркерами під час штурму будівлі:"], ["ul", ["під час переміщення зброя на запобіжнику;", "огляд приміщення — не змінюючи положення зброї, за принципом <b>«куди око — туди й прицілююсь»</b>;", "оцінку знижують на 1 бал за висування без прикриття, палець на спуску під час руху, заміну магазина правою рукою, або якщо порожній магазин не покладено в сумку;", "<b>«незадовільно» незалежно від результату</b>, якщо вхід у будинок до розриву навчальної гранати або зброя направлена в спину напарника."]], ["p", "Керівник стрільби рухається на 3–5 м позаду групи, а після вправи перевіряє зброю на розрядженість."]]}], "keys": ["СТВ — середня точка влучення; КТ — контрольна точка; ТП — точка прицілювання.", "Перевірка бою — з командирським ящиком (КЯ).", "Вправи: бойова двійка, бій у лісосмузі, бій у траншеї, ураження БпЛА малого класу.", "Кучність 25 м: 3 пробоїни в колі 100 мм (лежачи, з коліна), 150 мм (сидячи, стоячи).", "Вхід до розриву гранати або зброя в спину напарника — «незадовільно» без винятків."], "test": [["Що означає скорочення СТВ у балістиці?", ["Середня точка влучення", "Стандартна траєкторія вогню", "Стрілецька тактична взаємодія", "Сила тиску в стволі"], "СТВ — середня точка влучення; її положення відносно КТ показує, чи приведена зброя до нормального бою."], ["Що використовують під час перевірки бою стрілецької зброї на практиці?", ["Командирський ящик (КЯ)", "Тепловізійний приціл", "Лазерний далекомір", "Компас і секундомір"], "Перевірку бою практично проводять з використанням командирського ящика."], ["Яка вправа відпрацьовує ураження дронів?", ["Підготовча вправа № 30 — виявлення та ураження БпЛА малого класу, що рухаються", "КС 2.01(03).1.28 — стрільба по малорозмірних нерухомих цілях", "КС 6.02(03, 18).1.1 — ведення вогню у складі бойової двійки", "КС 2.01(03).1.28 — стрільба з місця по малорозмірних нерухомих цілях з автомата"], "Вправа № 30 — ураження рухомих БпЛА малого класу зі стрілецької зброї зі зміною вогневої позиції."], ["Яку вправу виконують, якщо немає бойових пострілів до РПГ-7?", ["КС 1.06.1.1 — стрільба по нерухомій цілі з ПУС-7 (ПУС AT-4)", "Вправу не виконують, а ставлять залік за теорію", "КС 2.01(03).1.28 — стрільба по малорозмірних цілях з автомата", "Метання навчальних гранат на дальність замість стрільби"], "За відсутності пострілів до РПГ-7 вправу замінюють на КС 1.06.1.1 з ПУС-7."], ["Яка контрольна вправа виконується на темі «Прийоми та способи ведення вогню»?", ["КС 3.01.2.2 «Бій у лісосмузі зі зміною вогневої позиції»", "КС 2.01.1.2 «Стрільба із-за укриття зі зміною плеча»", "КС 2.01(03).1.28 «Стрільба по малорозмірних цілях»", "КС 6.02(03, 18).1.1 «Ведення вогню у складі двійки»"], "Контрольна вправа — бій у лісосмузі зі зміною вогневої позиції."], ["Що потрібно для «заліку» у вправі на кучність з 25 м з положення лежачи без засобів захисту?", ["3 пробоїни в колі діаметром не більше 100 мм", "3 пробоїни в колі діаметром не більше 150 мм", "1 пробоїна в будь-якому місці мішені", "5 пробоїн у колі діаметром не більше 300 мм"], "Залік без ЗІЗ — 3 пробоїни в колі 100 мм (лежачи, з коліна) або 150 мм (сидячи, стоячи)."], ["Скільки відсотків влучень потрібно для оцінки «відмінно» у швидкісних підготовчих вправах?", ["91–100%", "50–60%", "70–80%", "Будь-яке влучення"], "91–100% — «відмінно», 81–90% — «добре», 70–80% — «задовільно»."], ["За якою дією штурм будівлі оцінюється «незадовільно» незалежно від результатів?", ["Вхід у будинок до розриву навчальної гранати", "Заміна магазина перед входом у будівлю", "Стрільба одиночними пострілами з укриття", "Доповідь старшому про закінчення стрільби"], "Вхід до розриву гранати або зброя в спину напарника — «незадовільно» без винятків."], ["Яким принципом керуються під час огляду приміщення?", ["«Куди око — туди й прицілююсь»", "«Спершу стріляй, потім дивись»", "«Зброя завжди донизу»", "«Огляд без зброї»"], "Огляд — не змінюючи положення зброї, за принципом «куди око — туди й прицілююсь»."], ["За що оцінку у вправі зі штурму будівлі знижують на 1 бал?", ["За палець на спусковому гачку під час пересування", "За вчасний кидок навчальної гранати у вікно", "За використання укриття біля стіни будівлі", "За доповідь командиру групи про виявлену ціль"], "Знижують за висування без прикриття, палець на спуску, заміну магазина правою рукою, магазин не в сумці."], ["Що з наведеного належить до понять зовнішньої балістики, які вивчають на курсі?", ["Прямий постріл, балістичний тунель, перший і другий нуль", "Калорійність пайка, норма води і темп маршу", "Тиск у шинах, витрата пального і швидкість", "Калорійність пайка, норма води на добу, темп маршу і відстань між привалами"], "Курсантів ознайомлюють з поняттями «прямий постріл», «балістична крива», «балістичний тунель», «перший нуль», «другий нуль»."], ["Як впливає завал зброї (нахил) під час стрільби?", ["Зміщує середню точку влучення", "Не має жодного впливу на влучання", "Збільшує купність стрільби вдвічі", "Зменшує віддачу зброї до нуля"], "Пояснюється особливість стрільби з завалом зброї — вплив кута нахилу на СТВ."], ["Що окремо демонструють на занятті з озброєння бойових машин?", ["Слабкі (уразливі) місця броньованої техніки противника", "Інтер’єр кабіни і місця екіпажу", "Порядок заправлення і обслуговування", "Інтер’єр бойового відділення, місця екіпажу і порядок посадки десанту"], "На занятті демонструють уразливі місця броньованої техніки противника і порядок її знищення."], ["Де перебуває керівник стрільби під час штурму будівлі з маркерами?", ["На відстані 3–5 м позаду бойової групи", "Усередині будівлі попереду бойової групи", "На командному пункті за 1 км від будівлі", "На даху сусідньої будівлі з біноклем"], "Керівник висувається на 3–5 м за бойовою групою, спостерігаючи за дотриманням заходів безпеки."], ["Що перевіряє керівник після ураження всіх цілей у вправі?", ["Зброю на розрядженість", "Кількість гільз на підлозі", "Чистоту взуття", "Нічого"], "Після вправи керівник перевіряє зброю на розрядженість."]]}, {"id": "t18", "mod": "Фізична підготовка", "src": "Таблиця 4, додаток 2, примітка до табл. 1", "title": "Фізична підготовка і визначення фізичного стану", "short": "Фізична підготовка", "sections": [{"h": "Навіщо фізична підготовка", "body": [["p", "Фізична підготовка спрямована на найважливіші фізичні і психічні якості для бою: <b>витривалість, силу, стійкість, впевненість у своїх силах, самоконтроль, сміливість, єдність</b>."], ["p", "Фізична підготовка — 18 годин практики, що входять у курс: подолання перешкод (5), прискорене пересування (5), функціональне тренування (6) і вихідний контроль (2)."], ["ul", ["навчальні заняття — <b>3 рази на тиждень по 1 годині</b>;", "ранкова зарядка — щоденно <b>20 хвилин</b>, крім вихідних і святкових днів;", "супутнє фізичне тренування — не менше <b>2 разів на тиждень по 25–30 хвилин</b>;", "самостійна робота — за індивідуальним планом, не більше 2 годин."]]]}, {"h": "Подолання перешкод", "body": [["p", "Тактична смуга перешкод — спершу по елементах без спорядження, потім у спорядженні зі зброєю з елементами <b>«БАрС»</b>, далі — в складі підрозділу. Принцип — від простого до складного."], ["key", "Перехід до наступної перешкоди — лише після якісного засвоєння попередньої."]]}, {"h": "Прискорене пересування", "body": [["p", "Навчальний підрозділ шикується в колону по два з визначеними дистанцією та інтервалом. Працюють <b>3 інструктори</b>: керівник — посередині колони, двоє — попереду і позаду, дублюють команди."], ["p", "За командою «БІГОМ — РУШ» — низький темп, зброя в руках перед собою, чергування бігу і ходьби. Від заняття до заняття змінюється співвідношення бігу і ходьби: 40/60, 50/50, 20/80, 30/70."], ["p", "Раптові команди з дублюванням усіма: «граната», «повітря», «противник з тилу, ліворуч, праворуч». Елементи «БАрС»: положення для стрільби, тактичний крок, швидкісна заміна магазина, швидкісне пониження з контролем сектору."], ["p", "Хто не може продовжувати — його переносять інші. На останньому занятті — дими, вибух-пакети, розтяжки зі страйкбольними гранатами, макети для психологічного впливу під навантаженням."]]}, {"h": "Функціональне тренування", "body": [["p", "Шість занять, кожне на певну якість: координація, швидкість, сила, спритність, витривалість, і фінальне — комплекс усіх якостей з естафетою. Керівник призначає курсантів, які самостійно проводять частину заняття, — для розвитку методичної майстерності. Комплекс вправ розробляє фахівець фізичної підготовки."]]}, {"h": "Рівні фізичного стану", "body": [["p", "Фізичний стан визначають на вхідному і вихідному контролі: <b>F1</b> — високий, <b>F2</b> — достатній, <b>F3</b> — низький. Складові — функціональний стан і фізична підготовленість."]]}, {"h": "Ортостатична проба", "body": [["p", "Етап 1: 3 хвилини лежачи на спині — вимірюють частоту серцевих скорочень (ЧСС) і тиск. Етап 2: повільно, за 3–5 секунд, встати — і одразу повторно виміряти ЧСС."], ["ul", ["<b>відмінна</b> реакція — ЧСС зросла не більше ніж на 11 ударів;", "<b>задовільна</b> — зросла на 12–18 ударів;", "<b>незадовільна</b> — зросла на 19 і більше або знизилась на 1 і більше удар."]], ["p", "Головний показник проби — ЧСС; додатково — вегетативні реакції: пітливість, шум у вухах, потемніння в очах. При незадовільній реакції до вправ не допускають, зараховують до F3, остаточний висновок дають медики."]]}, {"h": "Комплекс з чотирьох вправ", "body": [["p", "У військовій формі без зброї, одна за одною по 30 секунд без відпочинку:"], ["ul", ["згинання-розгинання рук в упорі лежачи;", "присідання з відведенням рук уперед;", "згинання колін до грудей в упорі лежачи;", "човниковий біг відрізками по 10 м."]], ["p", "Оцінка — за сумою повторень: <b>70 — високий рівень</b>, <b>60 — достатній</b>, <b>менше 60 — низький</b>. Після вихідного контролю фахівець порівнює результати з вхідними, щоб оцінити ефективність методів."], ["p", "На 6-му тижні 16-те заняття з фізичної підготовки проводять на початку тижня — щоб дати організму відновитися перед вихідним контролем."]]}], "keys": ["F1 — високий, F2 — достатній, F3 — низький рівень фізичного стану.", "Ортостатична проба: до +11 — відмінно, +12…18 — задовільно, +19 або зниження — незадовільно.", "4 вправи по 30 с: 70 повторень — високий, 60 — достатній.", "Заняття 3 рази на тиждень по 1 год, зарядка щодня 20 хв.", "Наступна перешкода — лише після засвоєння попередньої."], "test": [["Що означають рівні F1, F2, F3?", ["Високий, достатній і низький рівень фізичного стану", "Три фази бою: підготовка, атака, закріплення", "Три групи за стажем служби", "Три види спорядження за вагою"], "F1 — високий, F2 — достатній, F3 — низький рівень фізичного стану."], ["Як оцінюється ортостатична проба, якщо ЧСС після вставання зросла на 15 ударів?", ["Задовільна реакція", "Відмінна реакція", "Незадовільна реакція", "Проба недійсна"], "Підвищення на 12–18 ударів — задовільна реакція."], ["Яка реакція організму вважається відмінною за ортостатичною пробою?", ["Підвищення ЧСС не більше ніж на 11 ударів", "Підвищення ЧСС на 12–18 ударів", "Підвищення ЧСС на 19 і більше ударів", "Зниження ЧСС на 1 удар і більше"], "Відмінна реакція — збільшення ЧСС не більше ніж на 11 ударів."], ["До якої групи зараховують військовослужбовця з незадовільною реакцією на ортостатичну пробу?", ["F3, до комплексу вправ не допускають", "F1, але з меншим навантаженням", "F2, з повторною пробою через тиждень", "Відраховують з курсу за станом здоров’я"], "При незадовільній реакції до вправ не допускають і зараховують до F3; висновок дають медики."], ["Скільки триває кожна з чотирьох вправ комплексу оцінки фізичної підготовленості?", ["30 секунд без відпочинку між вправами", "1 хвилину з відпочинком 2 хвилини", "10 секунд з відпочинком 30 секунд", "2 хвилини без відпочинку між вправами"], "Усі вправи виконуються одна за одною по 30 с без відпочинку."], ["Скільки сумарних повторень відповідає високому рівню фізичної підготовленості?", ["70", "40", "50", "100"], "Високий рівень — 70 повторень, достатній — 60, низький — менше 60."], ["Як часто проводяться навчальні заняття з фізичної підготовки?", ["3 рази на тиждень по 1 годині", "Щодня по 3 години", "2 рази на тиждень по 2 години", "Раз на тиждень по 1 годині"], "Навчальні заняття — 3 рази на тиждень тривалістю 1 година."], ["Скільки триває щоденна ранкова фізична зарядка?", ["20 хвилин", "5 хвилин", "45 хвилин", "1 година"], "Ранкова зарядка — щоденно протягом 20 хвилин, крім вихідних і святкових днів."], ["Скільки інструкторів виділяється на навчальний підрозділ під час прискореного пересування?", ["3 — керівник посередині, двоє попереду і позаду", "1 — керівник попереду колони, а курсанти самі дублюють його команди", "2 — попереду і позаду колони", "5 — по одному на кожні шість курсантів"], "Керівник посередині подає команди, двоє інших попереду і позаду контролюють і дублюють."], ["Коли дозволено переходити до подолання наступної перешкоди?", ["Лише після якісного засвоєння попередньої", "Одразу, незалежно від
