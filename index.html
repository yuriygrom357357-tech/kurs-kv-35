<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F4EF">
<title>КУРС КВ 35 діб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF;--paper:#FFFFFF;--soft:#EFECE4;--ink:#18212F;--muted:#5B6575;--line:#E2DDD2;
  --acc:#1F4E8C;--acc-soft:#E6EDF7;--onacc:#FFFFFF;
  --amb:#B86E12;--hl:#FFF2D4;--hl-bar:#E0A33A;
  --ok:#2F7D57;--okbg:#E5F3EB;--bad:#B4382C;--badbg:#FBE7E4;
  --shadow:0 1px 2px rgba(24,33,47,.05),0 6px 24px rgba(24,33,47,.06);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161D;--paper:#1A2029;--soft:#222935;--ink:#ECE8E0;--muted:#A3ACBA;--line:#2C3442;
  --acc:#7FAAE6;--acc-soft:#1E2B40;--onacc:#0F1520;--amb:#E8B060;--hl:#2E2715;--hl-bar:#E0A33A;
  --ok:#5CC08C;--okbg:#16301F;--bad:#F08A7E;--badbg:#3A1C19;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#12161D;--paper:#1A2029;--soft:#222935;--ink:#ECE8E0;--muted:#A3ACBA;--line:#2C3442;
  --acc:#7FAAE6;--acc-soft:#1E2B40;--onacc:#0F1520;--amb:#E8B060;--hl:#2E2715;--hl-bar:#E0A33A;
  --ok:#5CC08C;--okbg:#16301F;--bad:#F08A7E;--badbg:#3A1C19;--shadow:none;}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left}
.mark{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em;flex:none}
.brand b{display:block;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib svg{width:22px;height:22px}

/* home */
.hero{padding:34px 0 8px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amb)}
.hero h1{font-size:clamp(34px,7vw,52px);line-height:1.02;font-weight:800;letter-spacing:-.02em;margin:8px 0 10px}
.hero p{color:var(--muted);max-width:620px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 4px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0}
.btn{height:48px;padding:0 20px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--paper);border:1px solid var(--line)}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.p:hover{filter:brightness(1.08)}
.btn svg{width:18px;height:18px}
.mod{margin:30px 0 10px;display:flex;align-items:baseline;gap:10px}
.mod h2{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mod:after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.row:hover{border-color:var(--acc);transform:translateY(-1px)}
.num{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.row.done .num{background:var(--acc);color:var(--onacc)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;line-height:1.3}
.row .t span{font-size:14px;color:var(--muted)}
.badge{flex:none;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.good{background:var(--acc-soft);color:var(--acc)}
.badge.low{background:var(--hl);color:var(--amb)}
.exam{margin-top:30px;background:var(--ink);color:var(--bg);border-radius:20px;padding:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.exam div{flex:1;min-width:220px}
.exam b{font-size:21px;display:block}
.exam span{opacity:.75;font-size:15px}
.exam .btn{background:var(--bg);color:var(--ink);border:0}
.foot{margin:36px 0 40px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

/* topic */
.thead{padding:26px 0 6px}
.thead .eyebrow{display:block;margin-bottom:6px}
.thead h1{font-size:clamp(26px,5vw,36px);line-height:1.12;font-weight:800;letter-spacing:-.01em}
.thead p{color:var(--muted);font-size:15px;margin-top:6px}
.tabs{display:flex;gap:6px;margin:18px 0 6px;background:var(--soft);padding:4px;border-radius:14px;width:max-content;max-width:100%}
.tab{height:40px;padding:0 18px;border-radius:10px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.lec{padding-bottom:150px}
.sec{margin-top:30px}
.sec h2{font-size:23px;line-height:1.25;font-weight:700;margin-bottom:10px;scroll-margin-top:90px}
.blk{border-radius:10px;padding:6px 12px;margin:0 -12px 6px;transition:background .25s;cursor:pointer;scroll-margin-top:110px;position:relative}
.blk:hover{background:var(--soft)}
.blk.now{background:var(--hl)}
.blk.now:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--hl-bar)}
.sec ul{list-style:none;margin:2px 0 8px}
.sec li.blk{padding-left:34px}
.sec li.blk:after{content:"";position:absolute;left:14px;top:.95em;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.sec li.blk.now:before{left:0}
.callout{background:var(--acc-soft);border-radius:14px;padding:14px 16px;margin:8px 0 10px;font-weight:500}
.callout small{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.callout.warn{background:var(--hl)}
.callout.warn small{color:var(--amb)}
.callout.now{box-shadow:0 0 0 2px var(--hl-bar)}
.keys{margin-top:40px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow)}
.keys h2{font-size:20px;margin-bottom:10px}
.keys ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.keys .btn{margin-top:16px}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.pl{max-width:860px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 40px rgba(24,33,47,.16);padding:10px 12px 12px}
.pl .bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;cursor:pointer;margin:2px 4px 8px}
.pl .bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px}
.pl .ctr{display:flex;align-items:center;gap:6px}
.play{width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex:none}
.play svg{width:24px;height:24px}
.pl .info{flex:1;min-width:0;padding:0 6px}
.pl .info b{display:block;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .info span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.spd{height:36px;min-width:52px;padding:0 10px;border-radius:10px;background:var(--soft);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

/* test */
.quiz{padding:10px 0 60px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-weight:600;margin:14px 0 8px;font-variant-numeric:tabular-nums}
.qprog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:22px}
.qprog i{display:block;height:100%;background:var(--acc)}
.qtext{font-size:clamp(21px,4vw,26px);line-height:1.3;font-weight:700;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:13px 14px;line-height:1.4;transition:border-color .12s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--soft);color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .k{background:var(--acc);color:var(--onacc)}
.verdict{margin-top:16px;border-radius:14px;padding:14px 16px;border-left:4px solid;line-height:1.45}
.verdict.ok{border-color:var(--ok);background:var(--okbg)}
.verdict.no{border-color:var(--bad);background:var(--badbg)}
.verdict b{display:block;margin-bottom:2px}
.qnext{margin-top:18px;display:flex;justify-content:flex-end}
.res{text-align:center;padding:30px 0 10px}
.ring{width:170px;height:170px;margin:0 auto 14px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .v b{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ring .v span{font-size:14px;color:var(--muted)}
.grade{font-size:24px;font-weight:800}
.res p{color:var(--muted);margin-top:4px}
.res .cta{justify-content:center}
.mist{margin-top:30px;text-align:left}
.mist h3{font-size:18px;margin-bottom:10px}
.mi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.mi b{display:block;line-height:1.35}
.mi .ans{color:var(--ok);font-weight:600;margin-top:6px}
.mi .ex{color:var(--muted);font-size:15px;margin-top:4px}
.mi .tp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.bytopic{margin-top:22px;text-align:left}
.bt{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.bt span:last-child{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

@media (max-width:560px){
  body{font-size:17px}
  .stats{gap:8px}.stat{padding:12px}.stat b{font-size:22px}
  .row{padding:12px;gap:12px}.num{width:34px;height:34px;font-size:14px}
  .hide-sm{display:none}
}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <button class="brand" id="homeBtn" aria-label="На головну">
    <span class="mark">КВ</span>
    <span style="min-width:0"><b id="hTitle">КУРС КВ 35 діб</b><small id="hSub">Командир відділення · ВОС-100</small></span>
  </button>
  <button class="ib" id="themeBtn" aria-label="Світла або темна тема" title="Тема"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div></header>

<main id="view"></main>

<div class="player hidden" id="player"><div class="pl">
  <div class="bar" id="pBar" role="slider" aria-label="Прогрес розділу"><i id="pFill"></i></div>
  <div class="ctr">
    <button class="ib" id="pPrev" aria-label="Попередній розділ"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="play" id="pPlay" aria-label="Слухати"><svg id="icPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="icPause" class="hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <button class="ib" id="pNext" aria-label="Наступний розділ"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <div class="info"><b id="pTitle">—</b><span id="pTime">Розділ 1 з 1</span></div>
    <button class="spd" id="pSpd" aria-label="Швидкість">1×</button>
  </div>
</div></div>

<script>
const DATA = {"topics": [{"id": "t01", "mod": "Загальні положення", "src": "Вступ, розділи 1.1–1.3", "title": "Мета, завдання і принципи підготовки", "short": "Мета і принципи", "sections": [{"h": "Навіщо цей курс", "body": [["p", "Програма об’єднаної (суміщеної) підготовки командирів відділень за ВОС-100 — це базовий рівень сержантського складу. Вона розроблена командуванням підготовки Командування Сухопутних військ за досвідом російсько-української війни 2022–2026 років і з урахуванням практики держав – членів НАТО. Термін навчання — 35 діб."], ["p", "Сержант — основа бойового підрозділу. Саме він безпосередньо організовує і веде особовий склад під час виконання бойових завдань. Командир відділення — не просто штатна одиниця, а ключова ланка, через яку рішення вищого командування перетворюються на дії в районі виконання завдань."], ["key", "Командир відділення — ключова ланка реалізації рішень командування. З цієї категорії починається нова українська армія: професійна, стійка і сумісна зі стандартами НАТО."]]}, {"h": "Два підходи: об’єднана і суміщена підготовка", "body": [["p", "Програма передбачає два підходи до підготовки командирів відділень за ВОС-100 «Стрілець»."], ["ul", ["<b>Об’єднана підготовка</b> — поєднання курсу лідерства базового рівня в центрах підготовки сержантського складу та курсу фахової підготовки базового рівня в навчальних підрозділах.", "<b>Суміщена підготовка</b> — курс лідерства і курс фахової підготовки проходять одночасно в одному навчальному підрозділі (школі підготовки сержантського складу)."]], ["p", "Навчальний процес за Програмою має бути гнучким, адаптивним та ітеративним. Положення Програми — базові: командири навчальних підрозділів застосовують їх творчо, з урахуванням обстановки, рівня підготовленості людей і наявних ресурсів."]]}, {"h": "Мета підготовки", "body": [["p", "Мета курсу — індивідуальна підготовка військовослужбовця як майбутнього командира відділення: формування навичок управління підрозділом у повсякденній діяльності та в бою, а також розвиток методичної майстерності — уміння готувати підлеглих до виконання завдань."], ["p", "Особлива увага — належному рівню теоретичних знань, практичних умінь і навичок, високим морально-діловим якостям, достатній фаховій і психологічній підготовленості."], ["key", "Три складові мети: управління підрозділом у побуті й у бою, власна фахова майстерність, уміння навчати підлеглих."]]}, {"h": "Основні завдання підготовки", "body": [["ul", ["формування і розвиток високих лідерських та морально-психологічних якостей;", "набуття, поглиблення і застосування знань, умінь і навичок за функціональними обов’язками;", "набуття спроможностей до виконання обов’язків за вищою посадою;", "вивчення нових способів дій підрозділів з урахуванням досвіду відсічі агресії рф;", "опанування основних видів озброєння відділення (взводу);", "набуття методичних знань з навчання і виховання підлеглих;", "формування спроможностей командувати відділенням і ефективно застосовувати його озброєння в основних видах бою;", "усвідомлення можливостей і завдань підрозділів у бою."]]]}, {"h": "Принципи підготовки", "body": [["ul", ["<b>навчати тому, що необхідно в сучасному бою;</b>", "свідомість, активність і самостійність тих, хто навчається; колективізм поєднується з індивідуальним підходом;", "єдність навчання і виховання, тісний зв’язок теорії з практикою;", "поєднання різних форм і методів, їх постійне вдосконалення на основі аналізу результатів і бойового досвіду;", "систематичність і послідовність — «від простого до складного»;", "відповідність цілей і змісту підготовки завданням командира відділення;", "наочність навчання;", "міцність засвоєння знань, формування умінь і навичок."]], ["key", "Перший принцип — головний фільтр: навчаємо тільки того, що потрібно для виконання завдань у сучасному бою."]]}, {"h": "Очікувані результати", "body": [["p", "Після курсу випускник повинен <b>знати</b>: основи застосування механізованого відділення в різних видах бою; організацію, озброєння і бойові можливості підрозділів; порядок управління підлеглими і взаємодії; вимоги керівних документів; основи морально-психологічного забезпечення."], ["p", "<b>Уміти</b>: організовувати і керувати діями відділення; оцінювати обстановку, приймати рішення і доводити завдання; ефективно застосовувати штатне озброєння; організовувати взаємодію із сусідами і засобами підтримки; підтримувати дисципліну і повсякденну діяльність."], ["p", "<b>Мати навички</b>: управління відділенням у різних видах бою; застосування штатного озброєння у складі підрозділу; організації бойового забезпечення; дій у складній обстановці та в умовах інформаційно-психологічного впливу противника."]]}], "keys": ["Командир відділення — ключова ланка між рішенням командування і дією в бою.", "Об’єднана підготовка — два курси в різних підрозділах; суміщена — обидва курси одночасно в одному.", "Мета: управляти підрозділом, бути фахівцем і вміти навчати підлеглих.", "Навчаємо тому, що потрібно в сучасному бою, — від простого до складного.", "Положення Програми базові: їх застосовують творчо, з урахуванням обстановки і ресурсів."], "test": [["Який термін навчання передбачає Програма підготовки командирів відділень за ВОС-100?", ["35 діб", "21 доба", "45 діб", "60 діб"], "Програма розрахована на 35 діб навчання — звідси й назва курсу «КВ 35 діб»."], ["Для якої військово-облікової спеціальності розроблена Програма?", ["ВОС-100 «Стрілець»", "ВОС-200 «Розвідник»", "ВОС-300 «Гранатометник»", "ВОС-500 «Оператор БпЛА»"], "Програма готує командирів відділень стрілецьких, піхотних, механізованих і мотопіхотних підрозділів за ВОС-100."], ["Чим суміщена підготовка відрізняється від об’єднаної?", ["Курс лідерства і фаховий курс проходять одночасно в одному навчальному підрозділі", "Курс лідерства проходять після фахового курсу в іншому навчальному центрі", "Фаховий курс замінює курс лідерства, якщо кандидат має бойовий досвід", "Обидва курси проходять дистанційно, а практика — у військовій частині"], "Об’єднана — поєднання курсу лідерства в центрі підготовки сержантів і фахового курсу в навчальному підрозділі. Суміщена — обидва курси одночасно в одній школі."], ["Яка роль командира відділення визначена у вступі до Програми?", ["Ключова ланка реалізації рішень вищого командування в районі виконання завдань", "Помічник командира взводу з питань обліку особового складу і майна", "Виконавець наказів, який не приймає самостійних рішень у бою", "Посадова особа, що відповідає лише за повсякденний порядок у підрозділі"], "Командир відділення — ключова ланка, що забезпечує бойову злагодженість і ефективність підрозділу безпосередньо в районі виконання завдань."], ["Що є метою об’єднаного (суміщеного) курсу?", ["Індивідуальна підготовка майбутнього командира відділення, навички управління підрозділом і методична майстерність", "Колективне злагодження відділення до рівня бойової готовності взводу та роти з бойовими стрільбами підрозділу", "Підготовка інструкторів базової загальновійськової підготовки для навчальних центрів", "Вдосконалення індивідуальних навичок стрільця без підготовки до управління людьми"], "Мета — індивідуальна підготовка: управління підрозділом у побуті й у бою плюс уміння готувати підлеглих."], ["Який принцип підготовки визначає зміст навчання як головний фільтр?", ["Навчати тому, що необхідно для виконання завдань у сучасному бою", "Навчати всьому, що передбачено статутами, у повному обсязі", "Навчати насамперед тому, що легко перевірити на іспиті", "Навчати так само, як навчали в мирний час до 2022 року"], "Перший принцип Програми — навчати тому, що потрібно в сучасному бою."], ["Як сформульовано принцип систематичності і послідовності?", ["Від простого до складного", "Від складного до простого", "Від практики до теорії без повторень", "Спочатку іспит, потім навчання"], "Систематичність і послідовність навчання — «від простого до складного»."], ["Яким має бути навчальний процес, побудований за Програмою?", ["Гнучким, адаптивним та ітеративним", "Незмінним і шаблонним", "Виключно лекційним", "Однаковим для всіх підрозділів без винятків"], "Через динамічний характер бойових дій процес має бути гнучким, адаптивним та ітеративним."], ["Як командири навчальних підрозділів мають застосовувати положення Програми?", ["Творчо, з урахуванням обстановки, рівня підготовленості і наявних ресурсів", "Дослівно, без змін і відхилень від тексту навчальної програми", "На власний розсуд, якщо курсанти вже мають бойовий досвід", "Лише після окремого погодження кожного заняття з командуванням"], "Положення Програми базові — їх застосовують творчо, з урахуванням конкретних умов."], ["Яке з наведених завдань підготовки передбачене Програмою?", ["Набуття спроможностей до виконання обов’язків за вищою посадою", "Набуття навичок планування операцій на рівні батальйону", "Набуття спроможностей керувати артилерійським підрозділом", "Вивчення порядку роботи штабу оперативного командування"], "Серед завдань — підготовка до виконання обов’язків за вищою посадою, щоб сержант міг замінити старшого."], ["Що з наведеного випускник повинен УМІТИ після курсу?", ["Оцінювати обстановку, приймати рішення і доводити завдання до підлеглих", "Розробляти оперативні плани і замисел бою для батальйону", "Керувати вогнем артилерійської батареї із закритих позицій", "Самостійно ремонтувати двигуни і трансмісію бронетехніки"], "Уміння командира відділення: оцінити обстановку, ухвалити рішення і довести завдання."], ["Досвід якої війни покладено в основу Програми?", ["Російсько-української війни 2022–2026 років", "Війни в Перській затоці та операцій НАТО", "Афганської війни та миротворчих місій", "Лише навчань НАТО мирного часу 2014–2021 років"], "Програма розроблена за досвідом російсько-української війни 2022–2026 років з урахуванням практики держав НАТО."], ["Який з цих принципів підготовки НЕ належить до визначених Програмою?", ["Пріоритет теорії над практикою", "Наочність навчання", "Єдність навчання і виховання", "Міцність засвоєння знань"], "Програма вимагає тісного зв’язку теорії з практикою, а не пріоритету теорії."], ["Які навички випускника пов’язані з впливом противника на свідомість?", ["Дії в складній бойовій обстановці та в умовах інформаційно-психологічного впливу противника", "Ведення інформаційних операцій у соціальних мережах проти противника", "Ведення інформаційних операцій у соціальних мережах і спілкування зі ЗМІ без погодження з командуванням", "Психологічне консультування цивільного населення в зоні бойових дій"], "Серед навичок — дії в умовах інформаційно-психологічного впливу противника."]]}, {"id": "t02", "mod": "Загальні положення", "src": "Розділ 1.3, розділ 2, додаток 1", "title": "Організація курсу: допуск, вхідний контроль, розклад", "short": "Організація курсу", "sections": [{"h": "Хто допускається до вхідного контролю", "body": [["p", "До вхідного контролю допускаються дві категорії військовослужбовців."], ["ul", ["ті, хто пройшов базову загальновійськову підготовку (фахову за ВОС-100), спланований на посаду командира відділення і має витяг з наказу або рекомендаційний лист командира частини;", "ті, хто вже призначений на посаду командира відділення (ВОС-100) і вище — аж до головного сержанта взводу (роти), — але не має курсу сержанта базового рівня."]], ["warn", "Допуск до вхідного контролю інших категорій військовослужбовців категорично заборонений."]]}, {"h": "Приймальна комісія і зарахування", "body": [["p", "Напередодні прибуття створюється приймальна комісія: представники військових частин, психологічної підтримки, медичні фахівці та інші посадові особи за рішенням начальника навчального центру."], ["p", "Результати роботи комісії оформлюються <b>Актом</b>. На його підставі видається наказ про зарахування. Списки зарахованих завіряються гербовими печатками відповідної військової частини."]]}, {"h": "Із чого складається вхідний контроль", "body": [["ul", ["<b>а) професійно-психологічний відбір</b> — визначення сильних і слабких якостей (методики діагностики готовності до ризику, лідерських якостей і здібностей, рівня суб’єктивного контролю);", "<b>б) медичний огляд</b> — при хронічних захворюваннях, які можуть вплинути на здоров’я під навантаженням, до навчання не допускають;", "<b>в) визначення рівня фізичного стану</b> — F1 високий, F2 достатній, F3 низький;", "<b>г) перевірка знань</b> з базової загальновійськової підготовки — тестування або опитування;", "<b>д) перевірка практичних умінь</b> — виконання нормативів з тактичної та вогневої підготовки."]], ["p", "Тестові завдання: <b>70% — у відкритій формі</b> (коротка, розгорнута відповідь, доповнення) і <b>30% — у закритій</b> (вибір варіанта). Основа — тактична і вогнева підготовка з доповненням із супутніх предметів."], ["p", "Навчальні групи бажано формувати з людей з однаковим або наближеним рівнем фізичного стану — так якісніше проходять і фізична підготовка, і практичні заняття."]]}, {"h": "Рейтинг курсантів", "body": [["p", "За результатами вхідного контролю складається рейтинг знань, умінь і навичок. З урахуванням рейтингу формуються навчальні взводи (групи)."], ["p", "Надалі рейтинг успішності ведеться весь курс і доводиться до курсантів наприкінці кожного навчального тижня під час аналізу проведених дій."]]}, {"h": "Хто не допускається і за що відраховують", "body": [["p", "<b>До навчання не допускаються</b>: схильні до порушення дисципліни (зокрема ті, хто прибув у стані сп’яніння); ті, хто відмовився від курсу рапортом; ті, хто показав незадовільні результати вхідного контролю; непридатні за станом здоров’я; ті, хто не має достатніх знань і навичок; не рекомендовані за результатами психологічного відбору."], ["p", "<b>Відрахувати з навчання</b> можуть за три причини:"], ["ul", ["систематичне порушення військової дисципліни;", "вживання алкоголю під час навчання;", "пропуск 20% занять Програми."]], ["key", "Межа пропусків — 20% занять. Перевищив — відрахування."]]}, {"h": "Календар курсу: 35 діб", "body": [["ul", ["<b>2 адміністративні доби</b>: перша — прийом, вхідний контроль, зарахування; остання — випуск, документи, відправка до частини;", "<b>29 навчальних діб</b>;", "<b>4 вихідні доби</b>, які не входять у розрахунок навчальних днів."]], ["p", "Навчальний день — <b>10 навчальних годин</b>, одна навчальна година — <b>45 хвилин</b>. Підготовка ведеться за розкладом занять."], ["p", "Самостійна підготовка — у дні занять після обіду, не більше двох годин, крім днів нічних занять. Нічні заняття плануються в темну пору доби, після заходу сонця."]]}, {"h": "Навчальні підрозділи та інструктори", "body": [["p", "У перший адміністративний день, до вечірньої повірки, за рейтингом формуються навчальні взводи <b>до 30 осіб</b>. Кожен взвод ділиться на <b>3 навчальні групи (відділення) до 10 осіб</b>."], ["p", "Інструктори взводів повинні мати курси базової загальновійськової підготовки, фахову підготовку ВОС-100, фахову підготовку базового рівня і курси інструктора базового рівня. Командири взводів (викладачі) — вищу військову освіту і курси підвищення кваліфікації з методичної підготовки."], ["p", "Теоретичні заняття проводяться у складі взводу в класах (з проєктором, екраном, ноутбуком). Практичні — у складі навчальних груп на тактичному полі, тренажерній базі, вогневому містечку, полігоні, в тирі."]]}, {"h": "Фіксація занять і облік", "body": [["p", "Інструктори на практичних заняттях обов’язково мають <b>боді-камери</b>. Відео використовують для детального розбору і аналізу проведених дій. Щодня матеріал копіюють на накопичувач командира підрозділу, зберігають <b>не менше 3 місяців</b>."], ["p", "Польові заняття також знімають з БпАК і зберігають у сервісі VEZHA системи Delta."], ["p", "Облік курсантів ведеться в електронній базі: особисті дані, результати вхідного контролю, усі досягнення. Після випуску облік триває <b>не менше пів року</b> — через зворотний зв’язок інструкторів з випускниками."], ["p", "На практичних заняттях і курсанти, і інструктори — в екіпіровці, засобах індивідуального захисту (шолом, бронежилет) і зі своєю штатною зброєю."]]}], "keys": ["До вхідного контролю — лише кандидати на посаду КВ з витягом (рекомендацією) або вже призначені без курсу.", "Вхідний контроль: психологічний відбір, медогляд, фізичний стан, знання, практичні навички.", "35 діб = 2 адміністративні + 29 навчальних + 4 вихідні.", "День — 10 навчальних годин по 45 хвилин. Взвод до 30, група до 10.", "Відрахування: систематичні порушення, алкоголь, пропуск 20% занять."], "test": [["Як розподіляються 35 діб курсу?", ["2 адміністративні, 29 навчальних, 4 вихідні", "5 адміністративних, 25 навчальних, 5 вихідних", "1 адміністративна, 30 навчальних, 4 вихідні", "35 навчальних діб без вихідних"], "Перша доба — прийом і вхідний контроль, остання — випуск; 29 навчальних і 4 вихідні."], ["Скільки триває навчальний день і одна навчальна година?", ["10 навчальних годин по 45 хвилин", "8 навчальних годин по 60 хвилин", "12 навчальних годин по 40 хвилин", "6 навчальних годин по 90 хвилин"], "Тривалість навчального дня — десять навчальних годин, година — 45 хвилин."], ["Пропуск якої частини занять є підставою для відрахування?", ["20%", "10%", "30%", "50%"], "Відрахування можливе у разі пропуску 20% занять Програми."], ["Хто з наведених може бути допущений до вхідного контролю?", ["Призначений командир відділення ВОС-100, який не проходив курс сержанта базового рівня", "Військовослужбовець іншої ВОС без витягу з наказу, але з бажанням навчатися", "Будь-який солдат, який ще не проходив базову загальновійськову підготовку", "Сержант, який уже має курс базового рівня і хоче пройти його повторно"], "Допускаються кандидати після БЗВП з витягом (рекомендацією) або вже призначені на посаду без курсу базового рівня."], ["У якому співвідношенні проводять тестування знань на вхідному контролі?", ["70% відкрита форма, 30% закрита", "30% відкрита форма, 70% закрита", "50% відкрита форма, 50% закрита", "100% закрита форма з вибором відповіді"], "Відкрита форма (коротка, розгорнута відповідь, доповнення) — 70%, закрита — 30%."], ["Якими нормативами перевіряють практичні навички на вхідному контролі?", ["З тактичної та вогневої підготовки", "З фізичної підготовки та стройової", "З водіння бронетехніки", "З інженерної підготовки та зв’язку"], "Практичні навички перевіряють виконанням нормативів з основних предметів — тактичної та вогневої підготовки."], ["Яка максимальна чисельність навчального взводу і навчальної групи?", ["Взвод до 30, група до 10 осіб", "Взвод до 40, група до 15 осіб", "Взвод до 24, група до 8 осіб", "Взвод до 50, група до 25 осіб"], "Взвод до 30 осіб ділиться на 3 навчальні групи (відділення) до 10 осіб."], ["Як оформлюються результати роботи приймальної комісії?", ["Актом, на підставі якого видається наказ про зарахування", "Усною доповіддю начальнику навчального центру", "Записом у журналі чергового з підписами членів", "Рапортом кожного кандидата на ім’я командира"], "Результати оформлюються Актом, на його підставі видається наказ про зарахування."], ["Скільки щонайменше зберігають відеозаписи з боді-камер інструкторів?", ["Не менше 3 місяців", "Не менше 1 тижня", "Не менше 1 місяця", "До кінця курсу навчання"], "Відео щодня копіюють на накопичувач командира; строк зберігання — не менше 3 місяців."], ["Скільки ведеться облік випускника після завершення підготовки?", ["Не менше пів року", "Не менше 1 місяця", "До кінця стажування", "Не менше 5 років"], "Після випуску облік триває не менше пів року через зворотний зв’язок інструкторів із випускником."], ["Коли проводиться самостійна підготовка?", ["У дні занять після обіду, не більше двох годин, крім днів нічних занять", "Щовечора після вечірньої повірки, до трьох годин, у будь-які дні", "У вихідні дні замість відпочинку, не менше чотирьох годин", "Зранку перед заняттями замість ранкової фізичної зарядки"], "Самопідготовка — після обіду, до двох годин, крім днів, коли є нічні заняття."], ["Як часто курсантам доводять рейтинг успішності?", ["Наприкінці кожного навчального тижня під час АПД", "Лише в день випуску разом із сертифікатом про навчання", "Щодня перед сніданком під час ранкового шикування", "Тільки за письмовим запитом курсанта на ім’я командира"], "Рейтинг доводиться в кінці кожного тижня під час аналізу проведених дій."], ["Яка з причин НЕ є підставою для відрахування за Програмою?", ["Одна незадовільна оцінка на занятті", "Систематичне порушення військової дисципліни", "Вживання алкогольних напоїв під час навчання", "Пропуск 20% занять Програми підготовки"], "Програма визначає три причини: систематичні порушення, алкоголь, пропуск 20% занять."], ["За яким принципом рекомендують формувати навчальні групи з урахуванням фізичного стану?", ["З однаковим або наближеним рівнем фізичного стану", "Порівну змішувати сильних і слабких, щоб сильні підтягували інших", "За військовими званнями — від старших до молодших", "За віком — від наймолодших до найстарших курсантів"], "Групи з наближеним рівнем ФС дають змогу рівномірно розподіляти навантаження і підвищують якість занять."], ["Де зберігаються відео польових занять, зняті з БпАК?", ["У сервісі VEZHA системи Delta", "На особистих телефонах інструкторів", "У відкритих соцмережах", "На флешці курсанта"], "Польові заняття фіксують БпАК і зберігають у сервісі VEZHA системи Delta з доступом за підпорядкованістю."]]}, {"id": "t03", "mod": "Загальні положення", "src": "Розділи 1.4–1.5, 5, 6, додаток 7", "title": "Контроль і оцінювання: тестування, польовий вихід, випуск", "short": "Контроль і оцінювання", "sections": [{"h": "Система контролю", "body": [["p", "Контроль іде за трьома етапами: <b>вхідний</b> (перший адміністративний день, кваліфікаційна комісія), <b>проміжний</b> (перевірка вивченого за період) і <b>підсумковий</b> — на завершальному етапі."], ["p", "Під час вхідного контролю визначають знання з основних дисциплін БЗВП, вивчають морально-ділові якості і мотивацію, проводять медичний огляд і розподіляють людей по групах."], ["p", "Того ж дня — церемонія відкриття курсу: представляють керівний склад та інструкторів, доводять цілі, організацію навчання, критерії оцінювання і заходи безпеки."]]}, {"h": "Тестування — контрольне заняття", "body": [["p", "Напередодні підсумкового контролю — <b>2-годинне тестування</b> в навчальному класі. Перевіряють теорію з лідерства, психологічної підготовки, основ повсякденної діяльності, методичної, тактичної, вогневої, технічної, інженерної, розвідувальної підготовки, військової топографії та зв’язку."], ["key", "Загальна оцінка за предмет складається з теорії (тест) і практичних дій. Оцінка за практичні дії — пріоритетна."]]}, {"h": "Як виставляється загальна оцінка", "body": [["ul", ["<b>«Відмінно»</b> — практика «відмінно», теорія не нижче «добре».", "<b>«Добре»</b> — практика «відмінно» або «добре», теорія не нижче «задовільно».", "<b>«Задовільно»</b> — обидві не нижче «задовільно», або теорія «незадовільно», але практика не нижче «добре».", "<b>«Незадовільно»</b> — не виконані умови на «задовільно»."]], ["p", "Тобто сильна практика може «витягнути» слабку теорію до задовільної оцінки, а от слабка практика сильною теорією не компенсується."]]}, {"h": "Допуск до підсумкового контролю", "body": [["p", "Допускаються курсанти, які пройшли повний курс і мають позитивні підсумкові оцінки з предметів."], ["warn", "Хто не відпрацював програму з основних предметів за фахом на 30% і більше — до підсумкового контролю не допускається."]]}, {"h": "Триденний польовий вихід", "body": [["p", "Підсумковий контроль — <b>триденний польовий вихід на незнайомій місцевості</b> у складі взводу. Планується 60 годин практичного виконання і 12 годин відпочинку — 4 години на курсанта на добу. Курсантів забезпечують сухим пайком на три доби."], ["p", "Мета — оцінити застосування знань тактики та індивідуальних навичок у польових умовах, а також уміння організовувати і проводити заняття."], ["ul", ["напередодні — постановка завдань, бойовий наказ, перевірка екіпірування і боєкомплекту;", "<b>підйом за тривогою о 04:00</b>;", "марш у район зосередження у складі відділень різними маршрутами <b>до 5 км</b> з контрольними точками: рух за азимутом, дії на замінованій ділянці, зв’язок, сигнали оповіщення;", "розташування на місцевості і безпосередня охорона: виживання, маскування слідів, відбиття нападу ДРГ, визначення відстаней, одиночний окоп;", "тактична підготовка — на ділянці, яка раніше не використовувалась на заняттях;", "супутні предмети в комплексі з тактикою; вогнева — на стрільбищі."]]]}, {"h": "Зміст трьох днів (алгоритм)", "body": [["p", "<b>День 1</b>: тривога, бойовий наказ на марш, марш у район зосередження, організація охорони, наступ на противника, що обороняється, з висуванням з глибини, переслідування, сторожова охорона."], ["p", "<b>День 2</b>: перехід до оборони вночі, система вогню, інженерне обладнання, схема опорного пункту і картки вогню, оборонний бій, відновлювальні дії, марш у запасний район, зустрічні дії і перехід у наступ."], ["p", "<b>День 3</b>: виконання вправ стрільб і нормативів, марш зі штурмом населеного пункту, його охорона, підведення підсумків і повернення в пункт постійної дислокації."], ["p", "На кожному етапі накази проходять ланцюгом: курсант-головний сержант взводу розробляє і віддає наказ курсантам-командирам відділень, а ті — своїм відділенням."]]}, {"h": "Кваліфікаційна комісія і випуск", "body": [["p", "На підсумковий контроль створюється кваліфікаційна комісія. До неї можуть залучати фахівців від замовників підготовки, представників інших навчальних центрів, офіцерів і сержантів частин, які направили курсантів, — для об’єктивності і прозорості."], ["p", "Результати оформлюються актом. Випускник отримує сертифікат (свідоцтво) і класну кваліфікацію; у військовий квиток вносять запис про навчання."], ["p", "Церемонія закриття відкривається Державним Гімном України, кращих курсантів нагороджують — по одному від кожної навчальної групи, кожному вручають групове фото. Завершується церемонія урочистим зачитуванням <b>Кодексу сержанта ЗС України</b>."]]}, {"h": "Керівництво підготовкою і облік", "body": [["p", "Керівництво має бути конкретним: якісне планування, своєчасна постановка завдань, систематичний контроль і допомога, об’єктивне підбиття підсумків, впровадження передового досвіду, зворотний зв’язок і ефективне використання навчально-тренувальних засобів."], ["p", "Облік результатів навчання ведуть інструктори в журналах підготовки взводу або в ІКС «МКП»."], ["p", "Після повернення в частину — <b>стажування</b> за місцем служби: практичний досвід на посаді, навчання і виховання особового складу, управління відділенням у різних видах бою."]]}], "keys": ["Оцінка за практичні дії — пріоритетна.", "Тестування — 2 години напередодні підсумкового контролю.", "Підсумковий контроль — триденний польовий вихід на незнайомій місцевості, підйом о 04:00, марш до 5 км.", "Не відпрацював 30% і більше програми з основних предметів — до підсумкового контролю не допускають.", "Церемонія закриття: Гімн на початку, Кодекс сержанта — наприкінці."], "test": [["Яка оцінка має пріоритет у загальній оцінці за предмет?", ["Оцінка за практичні дії", "Оцінка за теоретичний тест", "Оцінка за конспект", "Оцінка за стройовий огляд"], "Загальна оцінка складається з теорії і практики, при цьому практика — пріоритетна."], ["Курсант отримав за практику «добре», а за теорію «незадовільно». Яка загальна оцінка?", ["«Задовільно»", "«Незадовільно»", "«Добре»", "«Відмінно»"], "«Задовільно» ставлять і тоді, коли теорія «незадовільно», але практичні дії не нижче «добре»."], ["Що потрібно для загальної оцінки «відмінно»?", ["Практика «відмінно», теорія не нижче «добре»", "Теорія «відмінно», практика не нижче «добре»", "Обидві оцінки не нижче «добре»", "Практика «добре», теорія «відмінно»"], "«Відмінно» — практичні дії «відмінно», а знання теорії не нижче «добре»."], ["Скільки триває контрольне заняття (тестування)?", ["2 години", "30 хвилин", "1 доба", "6 годин"], "Контрольне заняття проводиться шляхом 2-годинного тестування в класі."], ["Курсант не відпрацював 30% програми з основних предметів. Чи допускається він до підсумкового контролю?", ["Ні, не допускається", "Так, без обмежень", "Так, але лише до теоретичної частини", "Так, якщо має рекомендацію командира"], "Курсанти, які не відпрацювали програму з основних предметів на 30% і більше, до підсумкового контролю не допускаються."], ["О котрій годині підйом за тривогою на підсумковому контролі?", ["О 04:00", "О 06:00", "О 00:00", "О 07:30"], "Підйом за тривогою проводиться о 04:00, оцінюються дії за тривогою і підготовка екіпірування."], ["Якої довжини маршрути висування на підсумковому контролі?", ["До 5 км", "До 1 км", "20–25 км", "Не менше 15 км"], "Висування в район зосередження — у складі відділень різними маршрутами до 5 км з контрольними точками."], ["Скільки годин відпочинку на добу планується для одного курсанта під час польового виходу?", ["4 години", "8 годин", "1 година", "Відпочинок не планується"], "З розрахунку 60 годин практичного виконання і 12 годин відпочинку — по 4 години на курсанта на добу."], ["Де перевіряють знання з тактичної підготовки на підсумковому контролі?", ["На спеціально обладнаній ділянці, яка раніше не використовувалась на заняттях", "На тій самій ділянці, де проходила більшість практичних занять", "У навчальному класі на макеті місцевості за картками завдань", "На тій самій ділянці тактичного поля, де проходила більшість практичних занять курсу"], "Незнайома ділянка показує реальні навички, а не завчений маршрут."], ["Для чого до кваліфікаційної комісії залучають представників частин і інших навчальних центрів?", ["Для об’єктивності оцінювання і прозорості підсумкового контролю", "Щоб скоротити тривалість підсумкового контролю до однієї доби", "Щоб вони замінили інструкторів під час проведення занять", "Щоб забезпечити охорону полігона під час польового виходу"], "Залучення сторонніх представників забезпечує об’єктивність і прозорість."], ["Чим завершується церемонія закриття курсу?", ["Урочистим зачитуванням Кодексу сержанта ЗС України", "Урочистим маршем навчального взводу і врученням зброї найкращим курсантам", "Урочистим маршем навчального взводу", "Врученням зброї найкращим курсантам"], "Гімном церемонія відкривається, а завершується зачитуванням Кодексу сержанта."], ["Скільки кращих курсантів нагороджують на церемонії закриття?", ["По одному від кожної навчальної групи", "Одного найкращого на весь курс", "Трьох найкращих від кожного взводу", "Усіх, хто склав іспит на «відмінно»"], "Відзначають і нагороджують кращих курсантів — по одному від кожної навчальної групи."], ["Де проходить стажування після курсу?", ["За місцем служби після повернення з навчання", "У навчальному центрі протягом ще одного місяця", "У школі сержантів іншого виду військ", "У сусідній частині за вибором курсанта"], "Стажування проводиться за місцем служби — набуття досвіду на посаді командира відділення."], ["Як віддаються накази під час польового виходу?", ["Ланцюгом: курсант-ГСВ віддає курсантам-КВ, ті — своїм відділенням", "Інструктор особисто віддає наказ кожному курсанту окремо", "Командири відділень отримують накази напряму від начальника центру", "Наказів немає: курсанти діють лише за світловими сигналами"], "Кожен етап проходить за ланцюгом управління: ГСВ — командири відділень — особовий склад."], ["Де ведуть облік результатів навчання?", ["У журналах підготовки взводу або в ІКС «МКП»", "В особистих блокнотах курсантів, які здають після курсу", "У військових квитках курсантів після кожного заняття", "У загальному чаті навчального взводу в месенджері"], "Облік результатів навчання ведуть інструктори в журналах підготовки взводу або ІКС «МКП»."]]}, {"id": "t04", "mod": "Загальні положення", "src": "Розділ 1.6, тема 4.1.3, терміни", "title": "Аналіз проведених дій (АПД / AAR)", "short": "Аналіз проведених дій", "sections": [{"h": "Що таке АПД", "body": [["p", "<b>Аналіз проведених дій</b> (After Action Review, AAR) — динамічне, об’єктивне обговорення того, як особовий склад виконав завдання відповідно до стандартів. Кожен військовослужбовець може і повинен брати в ньому участь, якщо має розуміння, інформацію, погляди чи питання, що допоможуть підрозділу подолати слабкі сторони і зміцнити сильні."], ["p", "Стандарт базується на стандарті армії США <b>TC 25-20</b>. У Програмі АПД завершує майже кожне заняття."]]}, {"h": "Сутність: модератор, а не суддя", "body": [["p", "Слово для розбору надається всім учасникам почергово. Інструктор — не «суддя на процесі», а посередник: режисер, модератор обговорення. Так кожен самостійно аналізує дії в доброзичливій атмосфері."], ["key", "АПД не повинен використовуватись для пошуку винних."]]}, {"h": "П’ять ключових питань АПД", "body": [["ul", ["<b>1.</b> Що і як було сплановано?", "<b>2.</b> Що відбулося фактично? Що спрацювало добре, а що — погано?", "<b>3.</b> Які фактори вплинули на результат — позитивні чи негативні?", "<b>4.</b> Як виправити недоліки, не допустити повторення і впровадити найкращі практики?", "<b>5.</b> Які висновки і рекомендації слід впровадити та поширити?"]], ["p", "Логіка проста: план — факт — причини — виправлення — висновки."]]}, {"h": "Правила проведення", "body": [["ul", ["поведінка ведучого має викликати і посилювати довіру;", "<b>заборонено</b> виступати з трибуни, показувати зверхність, принижувати гідність і хамити;", "аналіз проводять <b>негайно</b>, поки люди активні, а спогади свіжі;", "уникати критики, приниження, порівняння з іншими, засудження, монологів і довгих «розборів польотів», призначення «крайніх»;", "новачкам пояснюють, що і чому відбувається;", "не перетворювати АПД на лекцію командира — заохочувати діалог і власні думки;", "створювати відкрите середовище для дискусії і критичного мислення, а не каральну атмосферу страху;", "обговорювати не лише слабкі місця, а й успішно виконані завдання."]]]}, {"h": "Проблеми, що заважають АПД", "body": [["ul", ["відсутність культури внутрішніх комунікацій серед командирів;", "придушення принципів лідерства й управління місією: компетентності, взаємної довіри, розумної ініціативи, відповідальності, управління ризиками;", "небажання і некомпетентність командирів організувати професійне обговорення;", "заборона підлеглим самостійно визначати, що сталося і чому;", "нерозуміння інструментів вивчення уроків і впровадження досвіду."]], ["p", "Добра практика здорового колективу — спільний розбір після завдання: у груповому форматі, без емоцій, у спокійній обстановці, кожен може виговоритися."]]}, {"h": "Які приклади доводять на АПД", "body": [["ul", ["позитивні й негативні бойові зіткнення підрозділів з досвіду війни;", "нові тактичні дії та прийоми застосування техніки партнерів;", "припасування спорядження і приховане пересування;", "нові способи виявлення і боротьби з БпЛА противника;", "усунення затримок під час стрільби, захист від тепловізорів;", "контроль витрати боєкомплекту і доповідь про залишок;", "нешаблонні рішення під час постановки завдань."]]]}, {"h": "Як АПД вивчають на курсі", "body": [["p", "Модуль I, предмет «Аналіз проведених дій» — 4 години. <b>Заняття 1</b> (2 год) — дискусія: визначення і мета, види АПД, три основні етапи — <b>планування, підготовка і проведення</b>, основні питання, навчальні відео або кейси, підсумкове опитування."], ["p", "<b>Заняття 2</b> (2 год) — групова вправа: спочатку група відпрацьовує практичну дію (наприклад, безшумне пересування до позицій противника), потім інструктор як лідер проводить АПД цієї вправи. Наприкінці рекомендовано провести <b>АПД на саме АПД</b>."]]}], "keys": ["АПД — об’єктивне обговорення виконання завдань відповідно до стандартів; основа — стандарт TC 25-20 армії США.", "Інструктор — модератор, а не суддя.", "П’ять питань: план — факт — фактори — виправлення — висновки.", "Проводити негайно, без пошуку винних і без монологів командира.", "Три етапи АПД: планування, підготовка, проведення."], "test": [["Яку роль виконує інструктор під час АПД?", ["Посередника — модератора обговорення", "Судді, який оцінює і визначає винних", "Лектора, який пояснює правильні дії", "Мовчазного спостерігача до кінця розбору"], "Інструктор — не «суддя на процесі», а режисер і модератор обговорення."], ["Для чого АПД НЕ повинен використовуватись?", ["Для пошуку винних", "Для виявлення сильних сторін", "Для впровадження найкращих практик", "Для аналізу факторів, що вплинули на результат"], "Програма прямо наголошує: АПД не повинно використовуватись для пошуку винних."], ["На якому стандарті базується АПД?", ["TC 25-20 армії США", "STANAG 2116", "Статуті внутрішньої служби 1999 року", "Стандарті ISO 9001"], "Стандарт АПД базується на стандарті TC 25-20 армії США (After Action Review)."], ["Яке питання АПД ставлять ПЕРШИМ?", ["Що і як було сплановано?", "Хто винен у провалі?", "Які висновки поширити?", "Скільки витрачено боєприпасів?"], "Послідовність: план — що відбулося фактично — фактори — як виправити — висновки."], ["Коли слід проводити аналіз проведених дій?", ["Негайно, поки особовий склад активний, а спогади свіжі", "Через тиждень, коли емоції вщухнуть і все забудеться", "Лише в кінці курсу, після підсумкового контролю", "Тільки після невдалого завдання або втрат"], "Самокритичний аналіз проводять негайно, поки спогади свіжі."], ["Що з наведеного заборонено організатору АПД?", ["Виступати з трибуни і показувати зверхність", "Ставити учасникам запитання по черзі", "Підбивати підсумки і записувати висновки", "Пояснювати новачкам суть і порядок АПД"], "Організатору заборонено виступати з трибуни, демонструвати зверхність, принижувати гідність і хамити."], ["Що підлягає обговоренню під час АПД?", ["І слабкі місця, і успішно виконані завдання", "Лише помилки й невдалі рішення, бо успіхи не потребують обговорення", "Лише успіхи, щоб підняти мотивацію", "Тільки дії командира відділення"], "Обговорюють не тільки негативні дії, а й успішно виконані завдання."], ["Які три основні етапи АПД розглядаються на занятті?", ["Планування, підготовка, проведення", "Збір учасників, доповідь, оцінка", "Лекція, тестування, підсумки", "Аналіз, покарання, повторення"], "На першому занятті детально розглядають три етапи: планування, підготовку і проведення."], ["Що рекомендують зробити наприкінці практичного заняття з АПД?", ["Провести АПД на попередньо проведене АПД", "Скласти письмовий тест з теорії АПД", "Призначити відповідального за помилки", "Повторити вправу без жодного розбору"], "Рекомендується провести АПД на саме АПД — щоб відпрацювати якість розбору."], ["Яку атмосферу має створювати АПД?", ["Відкрите середовище, що заохочує дискусію і критичне мислення", "Суворе середовище з чіткою відповідальністю за помилки", "Формальну доповідь за статутом без зайвих обговорень", "Змагання між підрозділами за кращий результат"], "Вирішальне значення має відкрите середовище, а не каральна атмосфера."], ["Що з переліченого є проблемою, яка заважає якісному АПД?", ["Заборона підлеглим самостійно визначати, що сталося і чому", "Участь у розборі всіх учасників завдання без винятку", "Обговорення не лише помилок, а й успішних рішень", "Проведення розбору одразу після виконання завдання"], "Ігнорування досвіду і заборона підлеглим аналізувати самостійно — одна з типових проблем."], ["Хто може і повинен брати участь в АПД?", ["Кожен військовослужбовець, який має розуміння, інформацію чи питання", "Лише командири відділень і головний сержант взводу", "Лише командири відділень і головний сержант взводу, решта слухає й занотовує висновки", "Тільки інструктор і призначений ним курсант"], "За визначенням, кожен військовослужбовець може і повинен брати участь, якщо може допомогти підрозділу."], ["Чого слід уникати під час АПД?", ["Порівняння дій одного підрозділу з іншими і довгих «розборів польотів»", "Почергового надання слова кожному учаснику", "Почергового надання слова кожному учаснику обговорення та пошуку способів не допустити повторення помилок", "Обговорення факторів, що вплинули на результат"], "Слід уникати критики, порівнянь, засудження, монологів і призначення «крайніх»."], ["Яку дію рекомендують як основу для практичного АПД на занятті?", ["Ситуативне тактичне завдання, наприклад безшумне пересування до позицій противника", "Перегляд навчального фільму про бойові дії іншої армії", "Читання вголос розділів Бойового статуту з коментарями", "Перегляд навчального фільму про бойові дії іншої армії з подальшим письмовим тестом на запам’ятовування"], "Спочатку група виконує практичну дію, а в другій половині заняття проводить її АПД."]]}, {"id": "t05", "mod": "Загальні положення", "src": "Розділи 1.7–1.9, додатки 3 і 10", "title": "Особливості курсу, зворотний зв’язок і заходи безпеки", "short": "Особливості, feedback, безпека", "sections": [{"h": "Курсанти по черзі командують", "body": [["p", "Протягом курсу курсанти <b>по черзі виконують обов’язки командира відділення і головного сержанта взводу</b>. Щодня командир навчального підрозділу призначає їх із числа курсантів."], ["ul", ["ведуть облік особового складу;", "виконують і контролюють розпорядок дня;", "організовують виконання завдань командира підрозділу."]], ["p", "Повноваження діють від призначення наприкінці навчального дня — після АПД попередньої зміни — до передачі наступному курсанту. Щодня проводиться брифінг: самооцінка курсанта, оцінка від групи та інструктора."]]}, {"h": "Стрес-фактори в кожному предметі", "body": [["p", "Щоб сформувати психологічну гнучкість, керівникам рекомендовано наповнювати заняття стрес-факторами: психологічна складова в кожному предметі, макети, звукові та шумові імітатори, заняття на елементах психологічної смуги перешкод."], ["warn", "Залучати курсантів та інструкторів протягом навчального дня до заходів, не передбачених програмою і розкладом, — зокрема до господарських робіт, — категорично заборонено."]]}, {"h": "Зворотний зв’язок (Feedback)", "body": [["p", "Наприкінці курсу <b>обов’язково</b> проводиться зворотне оцінювання. Заповнені форми обов’язкові для врахування командуванням та інструкторами."], ["p", "У бланку курсант оцінює ставлення керівного складу, якість занять і професіоналізм інструкторів, навчальну базу, проживання, побут і харчування, кожен предмет за п’ятибальною шкалою; називає три найкращі і три найгірші заняття, позитивні й негативні сторони курсу, пропозиції. Підписувати бланк — за бажанням."], ["p", "Це не обмежує права курсантів висловлюватися протягом курсу. Узагальнений Feedback передають до управління підготовки командування Сухопутних військ для оновлення програм."], ["key", "Зворотний зв’язок — це процес отримання й аналізу відгуків, щоб своєчасно змінювати програми з урахуванням бойового досвіду."]]}, {"h": "Заходи безпеки: мета", "body": [["p", "На заняттях — висока дисципліна і суворий контроль дотримання правил безпеки."], ["key", "Заходи безпеки спрямовані не на відмову від небезпечних і ризикованих вправ, а на недопущення травмування особового складу."]]}, {"h": "Як досягається безпека", "body": [["ul", ["завчасне визначення заходів безпеки і підготовка навчального місця: розосередження, обладнані сховища, перекриті щілини;", "правильна методика і впевнене керівництво заняттям;", "справність ОВСТ, засобів психологічної підготовки та імітаційних засобів — холостих набоїв, димів, вибух-пакетів, імітаційних гранат;", "військова дисципліна і знання курсантами правил безпеки;", "систематичний контроль з боку інструкторів."]], ["p", "У пожежонебезпечний період дозволено замінювати набої з трасуючою кулею на звичайні."], ["warn", "У разі ракетної чи повітряної небезпеки — негайне розосередження і укриття особового складу під керівництвом інструктора."]]}, {"h": "Екіпірування на практичних заняттях", "body": [["p", "Кожен курсант і інструктор мають: бронежилет, шолом, РПС з підсумками і сумкою для скидання магазинів, тактичні рукавички, захисні окуляри, флягу або кемелбек, тактичний ліхтарик з червоним світлофільтром, компас, мапник, малу піхотну лопату МПЛ-50, розкладний ніж, індивідуальну аптечку."], ["p", "Малогабаритна радіостанція передбачена для інструктора."]]}, {"h": "Військові публікації", "body": [["p", "Електронні версії публікацій, методик і стандартів підготовки інструктори отримують через «Єдину електронну базу стандартів підготовки та військових публікацій» АСУ «Дніпро»."], ["p", "Там розміщують лише матеріали з грифом «відкрита інформація». Публікації за бойовим досвідом з обмеженим доступом доступні авторизованим користувачам «СЕДО» — по них звертаються до розробників."]]}], "keys": ["Курсанти щодня по черзі — командири відділень і ГСВ; щоденний брифінг із самооцінкою.", "Стрес-фактори — в кожному предметі.", "Господарські роботи в навчальний час — заборонено.", "Feedback наприкінці курсу обов’язковий.", "Безпека — не відмова від ризику, а недопущення травм."], "test": [["Хто виконує обов’язки командирів відділень і головного сержанта взводу під час курсу?", ["Курсанти по черзі, за щоденним призначенням", "Постійно один найкращий курсант за рейтингом", "Інструктори взводів за окремим графіком", "Офіцери навчального центру по черзі"], "Курсанти по черзі виконують обов’язки КВ і ГСВ — це щоденна практика командування."], ["Як оцінюються дії курсанта, який виконував обов’язки командира?", ["На щоденному брифінгу: самооцінка, оцінка групи та інструктора", "Лише письмовим тестом наприкінці навчального тижня", "Командиром частини після повернення курсанта", "Лише письмовим тестом наприкінці тижня, без самооцінки та оцінки іншими курсантами"], "Щодня проводиться брифінг — самооцінка, оцінювання іншими курсантами групи та інструктором."], ["На що спрямовані заходи безпеки на заняттях за Програмою?", ["На недопущення травмування, а не на відмову від ризикованих вправ", "На повну відмову від небезпечних і ризикованих вправ", "На заміну практичних занять теоретичними в класі", "На повну відмову від небезпечних і ризикованих вправ, щоб ніхто не наражався на ризик"], "Безпека не означає відмову від ризику — вона означає, що ніхто не травмується."], ["Чи можна залучати курсантів до господарських робіт у навчальний час?", ["Ні, категорично заборонено", "Так, якщо вистачає часу", "Так, за рішенням чергового", "Так, по суботах"], "Залучення до заходів поза програмою, зокрема господарських робіт, у навчальний день категорично заборонено."], ["Коли обов’язково проводиться зворотне оцінювання (Feedback)?", ["Наприкінці курсу", "Лише при скаргах", "На вхідному контролі", "Раз на рік"], "Наприкінці курсу зворотне оцінювання проводиться в обов’язковому порядку."], ["Чи обмежує підсумковий Feedback право курсантів висловлюватися протягом курсу?", ["Ні, висловлюватися можна в будь-який час", "Так, висловлюватися можна лише в кінці курсу", "Так, лише письмово через бланк зворотного зв’язку", "Так, тільки через командира навчальної роти"], "Програма прямо зазначає: це не обмежує права висловлюватися протягом курсу."], ["Що дозволено в пожежонебезпечний період під час стрільб?", ["Замінювати набої з трасуючою кулею на звичайні", "Повністю скасовувати всі вправи стрільб", "Стріляти лише трасуючими набоями", "Проводити стрільби тільки вночі"], "Для повноти виконання вправ дозволено заміну трасуючих набоїв на звичайні."], ["Що робити у разі ракетної чи повітряної небезпеки під час заняття?", ["Негайно розосередити і укрити особовий склад під керівництвом інструктора", "Продовжувати заняття, доки не надійде наказ командира", "Зібрати всіх курсантів у шеренгу для перевірки", "Продовжувати заняття до кінця і лише після цього доповісти командиру роти про сигнал тривоги"], "Розосередження і укриття проводяться негайно під керівництвом інструктора."], ["Для чого в заняття впроваджують стрес-фактори?", ["Для формування психологічної гнучкості", "Для перевірки дисципліни", "Для скорочення навчального часу", "Для відбору найкращих курсантів"], "Стрес-фактори, імітатори та психологічна смуга перешкод формують психологічну гнучкість."], ["Яке спорядження з переліку передбачене лише для інструктора?", ["Малогабаритна радіостанція", "Тактичний ліхтарик", "Компас і мапник під карту", "Захисні окуляри"], "Усе інше (бронежилет, шолом, РПС, компас, аптечка) — для кожного; радіостанція — для інструктора."], ["Який світлофільтр має бути на тактичному ліхтарику?", ["Червоний", "Білий без фільтра", "Ультрафіолетовий", "Жовтий"], "Ліхтарик тактичний — з червоним світлофільтром, щоб зберігати нічний зір і маскування."], ["Що з переліченого входить до заходів безпеки на заняттях?", ["Завчасна підготовка навчального місця, розосередження, сховища і перекриті щілини", "Відмова від імітаційних засобів і холостих набоїв на заняттях", "Проведення практичних занять без інструктора для самостійності", "Скорочення кількості учасників практичного заняття до однієї групи"], "Безпеку забезпечують підготовкою місця, методикою, справною технікою, дисципліною і контролем."], ["З якого моменту курсант виконує обов’язки командира відділення?", ["З призначення наприкінці навчального дня після АПД попередньої зміни", "З понеділка кожного навчального тижня за наказом командира роти", "Після складання підсумкового контролю на польовому виході", "Лише на час тактичних занять, а після них обов’язки знімаються"], "Повноваження діють з моменту призначення наприкінці дня до передачі наступному курсанту."], ["Які матеріали розміщують у «Єдиній електронній базі стандартів підготовки»?", ["Лише з грифом «відкрита інформація»", "Будь-які, включно з таємними", "Лише накази про нагородження", "Особисті справи військовослужбовців"], "У базі розміщують публікації лише з максимальним грифом «відкрита інформація»."]]}, {"id": "t06", "mod": "Курс лідерства", "src": "Розділ 3", "title": "Курс лідерства базового рівня", "short": "Лідерство", "sections": [{"h": "Мета курсу лідерства", "body": [["p", "Курс лідерства має на меті <b>перетворити солдата на лідера, якому довіряють</b>. Він складається з п’яти тем; більшість годин — практичні: дискусії, есе, публічні виступи, кейси, вправи."], ["ul", ["Тема 1. Особливості професії сержанта;", "Тема 2. Основи військового лідерства;", "Тема 3. Роль та місце сержанта у повсякденній діяльності та в бою;", "Тема 4. Дії у тактичному середовищі;", "Тема 5. Лідерські якості сержанта в практичному застосуванні."]], ["p", "Під час самостійної підготовки курсанти проходять онлайн-курс <b>«Основи планування бою»</b> у застосунку <b>«Армія+»</b> і отримують електронний сертифікат."]]}, {"h": "Професія сержанта", "body": [["p", "Перша тема — сержантський корпус ЗС України: структура посад і звань, вимоги до підготовки та освіти, просування по службі і кар’єра, робота <b>рад сержантів</b>."], ["p", "Друге заняття — морально-етичні принципи: <b>Військовий Етос</b> сержантського і старшинського складу, <b>Кодекс сержанта ЗС України</b>, традиції та церемонії сержантського корпусу. Етос курсанти далі вивчають у вільний час."], ["key", "Найкращий спосіб навчити — власний приклад. Почуття, які сержант хоче пробудити в солдатах, спершу мають міцно закріпитися в ньому самому."]]}, {"h": "Основи військового лідерства", "body": [["p", "Стилі керівництва і ситуативні фактори вибору стилю; повноваження, підзвітність і відповідальність; лідерство, його принципи, атрибути і навички лідера; <b>традиційне і децентралізоване управління</b>."], ["p", "Заняття з етики проходить як керована дискусія: клас ділять на дві сторони і разом розбирають <b>близько 10 етичних дилем</b>. Умова — обґрунтоване пояснення кожною стороною свого рішення."], ["p", "Далі кожен пише есе «Військове лідерство у повсякденній та бойовій діяльності підрозділу» — <b>від 3 до 5 сторінок</b>, без спілкування і списування, — а потім виступає з ним публічно: <b>до 5 хвилин</b>, після чого 2 хвилини на запитання."], ["p", "Окреме заняття — алгоритм прийняття швидких рішень у складі відділення і прояв ініціативи командира в умовах обмеженого часу."]]}, {"h": "Роль сержанта в побуті й у бою", "body": [["ul", ["обов’язки командира відділення і головного сержанта взводу — з бойовими прикладами;", "комунікація з підлеглими: внутрішня комунікація, активне слухання, інформування, АПД, мотивування, тімбілдинг, коучинг;", "комунікація з офіцерами: формальні й неформальні відносини, розподіл повноважень, менторство, субординація;", "вплив ЗМІ і соцмереж на бойові дії, ризики соцмереж, політика спілкування з репортерами;", "есе і публічний виступ «Роль та місце сержанта в забезпеченні виконання підрозділом завдань» — виступ до 3 хвилин, 1 хвилина на запитання."]], ["warn", "Функціональні обов’язки командира відділення кожен курсант вивчає напам’ять. З обов’язками головного сержанта взводу — ознайомлюються."]]}, {"h": "Дії у тактичному середовищі", "body": [["p", "<b>Макетування</b>: види макетів місцевості (тимчасові, стаціонарні), вибір місця, порядок створення і віддання OPORD — бойового наказу — на макеті. На практиці малі групи будують макет за супутниковим знімком або аерофотознімком."], ["p", "<b>Смуга реакції лідера</b> — 6 годин. Групи по 6–8 осіб. Інструктаж лідеру — 2 хвилини, на кожне підзавдання — 15 хвилин. Можна користуватися лише виданим обладнанням; не можна торкатися чорних елементів і виходити за межі ділянки. Спостерігачі не допомагають, окрім небезпечних ситуацій; за допомогу — штрафний час."], ["p", "Якщо смуги немає — виконують вправи з додатка 4: подолання струмка з вантажем, переправа по мотузці, перенесення замащеної колоди, проходження загороджень, протитанкового рову, високого паркану, болота. У кожній задача командира однакова: <b>зрозуміти завдання, сформувати і озвучити задум, контролювати виконання</b>."]]}, {"h": "Лідерські якості на практиці", "body": [["p", "Кейси трьох типів: неналежна внутрішня комунікація; недостатня згуртованість колективу (сильні неформальні лідери, мікрогрупи); неналежна налаштованість особового складу на виконання завдання. Курсант визначає алгоритм своїх дій, потім заслуховування і обговорення."], ["p", "Мозковий штурм: групи визначають <b>близько 10 основних морально-психологічних якостей</b> професійного сержанта, записують на ватмані. Показник приймається за згодою більшості, активність кожного обов’язкова. Представник групи доповідає до 10 хвилин; розбіжності між групами переходять у керовану дискусію або дебати."]]}], "keys": ["Мета курсу лідерства — перетворити солдата на лідера, якому довіряють.", "Особистий приклад — основа виховання.", "Обов’язки командира відділення — напам’ять.", "Есе 3–5 сторінок і публічний виступ — інструменти мислення і впевненості.", "Задача командира у будь-якій вправі: зрозуміти завдання — озвучити задум — контролювати виконання."], "test": [["Яку мету має курс лідерства базового рівня?", ["Перетворити солдата на лідера, якому довіряють", "Навчити стройової підготовки", "Підготувати інструкторів з фізичної підготовки", "Вивчити історію ЗС України"], "Так сформульовано мету курсу в Програмі."], ["Який онлайн-курс проходять курсанти в застосунку «Армія+» під час самопідготовки?", ["«Основи планування бою»", "«Тактична медицина»", "«Англійська мова для військових»", "«Основи кібербезпеки»"], "Курсанти проходять онлайн-курс «Основи планування бою» і отримують електронний сертифікат."], ["Які документи вивчають на занятті з морально-етичних принципів сержантського складу?", ["Військовий Етос сержантського і старшинського складу та Кодекс сержанта ЗС України", "Статут внутрішньої служби та Дисциплінарний статут ЗС України", "Статут внутрішньої служби, Дисциплінарний статут ЗС України і накази про порядок нагородження військовослужбовців", "Стандарти НАТО з лідерства і накази про нагородження"], "Доводяться основні положення Етосу та Кодекс сержанта, а також традиції і церемонії."], ["Що кожен курсант має вивчити напам’ять?", ["Функціональні обов’язки командира відділення", "Обов’язки головного сержанта взводу", "Функціональні обов’язки головного сержанта взводу", "Повний текст Курсу стрільб"], "Обов’язки КВ — напам’ять; з обов’язками ГСВ — лише ознайомлюються."], ["Якого обсягу есе пишуть курсанти?", ["Не менше 3, але не більше 5 сторінок", "Одна сторінка, усно", "10–15 сторінок", "Від 8 до 10 сторінок з обов’язковим списком літератури"], "Есе — від 3 до 5 сторінок, без спілкування і списування."], ["Скільки етичних дилем обговорюють на занятті з військової етики?", ["Близько 10", "Одну", "Близько 50", "Жодної — лише лекція"], "Завдання — спільно обговорити біля 10 етичних дилем, обґрунтовуючи рішення кожної сторони."], ["Скільки осіб у групі на «Смузі реакції лідера»?", ["6–8", "2–3", "15–20", "Увесь взвод"], "Особовий склад розділяється на групи по 6–8 чоловік."], ["Скільки часу відводиться на кожне підзавдання на «Смузі реакції лідера»?", ["15 хвилин", "2 хвилини", "1 година", "Без обмеження часу"], "2 хвилини — на інструктаж лідеру, 15 хвилин — на виконання кожного підзавдання."], ["Що отримує група, якщо спостерігачі допомогли їй без небезпечної ситуації?", ["Штрафний час", "Додаткові бали", "Додаткове обладнання", "Нічого"], "Спостерігачі не допомагають, окрім небезпечних ситуацій; за таку допомогу — штрафний час."], ["Яка задача командира у кожній вправі на функціональне лідерство з додатка 4?", ["Зрозуміти завдання, сформувати і озвучити задум, контролювати виконання", "Виконати вправу самостійно, поки група спостерігає", "Доручити все найсильнішому і стежити за часом", "Виконати вправу самостійно, поки група спостерігає, а потім пояснити помилки кожного"], "Три кроки командира однакові для всіх вправ: зрозуміти — озвучити задум — контролювати."], ["Що таке OPORD, який віддають на макеті місцевості?", ["Бойовий наказ", "Звіт про втрати", "Заявка на боєприпаси", "Графік нарядів"], "OPORD (Operation Order) — бойовий наказ; його відпрацьовують на макеті місцевості."], ["Скільки триває публічний виступ на тему «Військове лідерство у повсякденній та бойовій діяльності підрозділу»?", ["Не більше 5 хвилин і 2 хвилини на запитання", "До 3 хвилин і 1 хвилина на запитання", "До 10 хвилин без запитань", "До 30 хвилин і обговорення"], "Регламент — до 5 хвилин, дотримання обов’язкове, далі 2 хвилини на запитання."], ["Які проблемні ситуації розбирають у кейсах теми 5?", ["Неналежна комунікація, недостатня згуртованість, неналежна налаштованість на завдання", "Ремонт техніки, логістика і забезпечення пальним", "Порушення правил поводження зі зброєю, втрата майна, запізнення на шикування і порушення форми одягу", "Порушення правил стрільби і поводження зі зброєю"], "Три типи кейсів: комунікація, згуртованість колективу, налаштованість на виконання завдання."], ["Як приймається показник якості сержанта під час мозкового штурму?", ["За згодою більшості курсантів групи", "Рішенням інструктора одноосібно", "Голосом найстаршого за званням", "Жеребкуванням серед учасників"], "Умова визначення показника — згода більшості, а активність кожного учасника обов’язкова."], ["Які види управління розглядаються на занятті «Стилі керівництва та зовнішня концепція лідерства»?", ["Традиційне і децентралізоване", "Ручне і автоматизоване", "Цивільне і військове", "Одноосібне і колегіальне"], "Серед питань заняття — поняття традиційного та децентралізованого управління."]]}, {"id": "t07", "mod": "Модуль I – Введення", "src": "Теми 4.1.1, 4.1.2, 4.1.4, терміни", "title": "Статути, інформаційна безпека, методична підготовка", "short": "Модуль I: статути, інфобезпека, методика", "sections": [{"h": "Склад Модуля I", "body": [["p", "Модуль I «Введення» охоплює чотири предмети: <b>організаційна підготовка</b>, <b>інформаційна безпека</b>, <b>аналіз проведених дій</b> і <b>методична підготовка</b>. АПД розглядаємо окремою темою, тут — решта три."]]}, {"h": "Організаційна підготовка", "body": [["p", "<b>Бойові статути.</b> Розглядають різновиди бойових статутів видів і родів військ, структуру і зміст Бойового статуту механізованих і танкових військ Сухопутних військ — частина про взвод, відділення, екіпаж. За потреби — статут іншого роду військ залежно від категорії курсантів."], ["p", "<b>Робота командира відділення: особистий приклад.</b> Заняття-дискусія в групі 8–10 осіб: форми і методи виховання підлеглих, ситуативні завдання, де керівник лише спостерігає. Відео з принципом <b>«роби як я»</b>."], ["key", "Особистий приклад командира — елемент колективного успіху."]]}, {"h": "Інформаційна безпека", "body": [["p", "Заняття 1 — <b>небезпека мобільних телефонів і планшетів на полі бою</b>: типи ідентифікації особи і механізми виявлення пристроїв ворожими системами радіоелектронної розвідки (РЕР)."], ["p", "Заняття 2 — <b>практичні рекомендації</b>: підготовка телефонів і планшетів до безпечного використання, програмне забезпечення, через яке ворог може отримати інформацію, створення, зберігання і використання паролів."], ["key", "Увімкнений телефон на позиції — це випромінювання, яке противник може виявити і вразити."]]}, {"h": "Методична підготовка: основи", "body": [["p", "Керівні документи підготовки (доктрини, настанови), основні поняття, принципи — зокрема «від простого до складного», форми і методи (інструкторсько-методичне, показове заняття), <b>стандарт підготовки (СТП)</b> — призначення, структура і порядок виконання."], ["p", "Окремо — <b>щільність (насиченість) заняття</b>: раціональне використання навчального часу з постійним навантаженням на курсантів."], ["p", "<b>Алгоритм підготовки керівника до заняття</b>:"], ["ul", ["особиста підготовка і уточнення вихідних даних;", "вибір ділянки і рекогносцировка району заняття;", "розробка плану проведення заняття;", "підготовка тих, кого навчають, району і засобів матеріально-технічного забезпечення."]], ["p", "Також вивчають навчальну матеріально-технічну базу: польову, приказармену і ротну."]]}, {"h": "Типи занять і їхня мета", "body": [["p", "<b>Тактико-стройове заняття</b> — тренування навичок до автоматизму. Головний індикатор — багаторазове повторення нормативу від повільного до швидкого виконання: <b>«від повзання до бігу»</b>. Це основна форма навчання окремого солдата і перша сходинка злагодження відділення."], ["p", "<b>Тактичне заняття</b> — злагоджені дії підрозділу і вміле керування ним за одним із видів бою. Головна відмінність від тактико-стройового: усі навчальні питання відпрацьовують <b>в єдиній тактичній обстановці і в суворій послідовності</b>. З відділенням його проводить командир взводу, зі взводом — командир роти."], ["p", "Успіх тактичної підготовки досягається, коли обстановка максимально наближена до сучасного бою — з БпЛА, демонстраційними групами, — і викликає високу фізичну і психічну напруженість."], ["p", "<b>Практичні стрільби</b> — основні положення Курсу стрільб, посадові особи для керівництва стрільбою, заходи безпеки і правила поводження зі зброєю."]]}, {"h": "Навчання на чужих помилках", "body": [["p", "Ключовий прийом методичних занять: курсанти дивляться відео заняття, проведеного <b>на низькому методичному рівні з помилками інструктора</b>, обговорюють помилки кожної частини — вступної, основної, заключної. Потім дивляться заняття <b>на високому рівні без помилок</b> і порівнюють. Керівник виступає спостерігачем і підсумовує."]]}, {"h": "Форми і методи навчання — терміни", "body": [["ul", ["<b>Вправа</b> — цілеспрямоване виконання розумових і практичних дій для засвоєння знань і формування навичок.", "<b>Тренування</b> — осмислене багаторазове повторення вже вивчених вправ для їх закріплення.", "<b>Групова вправа</b> — практичне заняття з управління підрозділом, де курсанти виступають в ролі посадових осіб.", "<b>Дискусія</b> — метод, що дозволяє викласти різні точки зору і обґрунтувати свою позицію.", "<b>Практичний (репродуктивний) метод</b> — виконання дій за алгоритмом, визначеним керівником.", "<b>Пошуковий (евристичний) метод</b> — самостійний пошук інформації чи оптимального варіанту дій за напрямом, визначеним керівником.", "<b>Норматив</b> — часовий, кількісний і якісний показник виконання завдань, прийомів і дій."]]]}], "keys": ["Модуль I: організаційна підготовка, інформаційна безпека, АПД, методична підготовка.", "Телефон на полі бою — ціль для ворожої РЕР.", "Тактико-стройове — до автоматизму, «від повзання до бігу»; тактичне — в єдиній обстановці і послідовності.", "Щільність заняття — постійне навантаження, без порожнього часу.", "Методика вчиться на порівнянні поганого і доброго заняття."], "test": [["Яка головна мета тактико-стройового заняття?", ["Тренування і вдосконалення навичок до автоматизму", "Перевірка знань статутів і нормативних документів", "Злагодження підрозділу в єдиній тактичній обстановці", "Ознайомлення з новою технікою без повторень"], "Мета тактико-стройового заняття — довести навички до автоматизму."], ["Як сформульовано головний індикатор тактико-стройового заняття?", ["Багаторазове повторення нормативу «від повзання до бігу»", "Одноразове показове виконання нормативу інструктором", "Виконання нормативу одразу на максимальній швидкості", "Письмова доповідь курсанта про хід виконання"], "Від повільного виконання нормативу — до швидкого, встановленого показником."], ["Чим тактичне заняття відрізняється від тактико-стройового?", ["Усі питання відпрацьовуються в єдиній тактичній обстановці і в суворій послідовності", "Воно проводиться лише в класі на макеті без виходу на місцевість", "Його проводить командир відділення зі своїм відділенням", "На ньому відпрацьовують окремі прийоми з багаторазовими повтореннями"], "У тактичному занятті — одна обстановка, суворий порядок дій, злагодженість підрозділу."], ["Хто проводить тактичне заняття з відділенням?", ["Командир взводу", "Сам командир відділення", "Командир бригади", "Психолог"], "З відділенням — командир взводу, зі взводом — командир роти."], ["Що вивчають на заняттях з інформаційної безпеки?", ["Небезпеку телефонів і планшетів на полі бою та механізми їх виявлення ворожою РЕР", "Правила роботи з друкованою пресою та листування з рідними", "Порядок отримання паролів від командира для доступу в мережу", "Правила листування з рідними, роботу з друкованою пресою та порядок отримання дозволу на фото і відео"], "Доводиться небезпека мобільних пристроїв, типи ідентифікації особи і виявлення приладів системами РЕР."], ["Що з наведеного входить до практичних рекомендацій з інформаційної безпеки?", ["Створення, зберігання і використання паролів", "Публікація геолокації позицій", "Встановлення будь-яких застосунків з інтер
